name: Sprint59 - administração e siglas na pesquisa

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir escapes antigos e aplicar Sprint59
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove o bloco SPRINT58 antigo, que foi gravado com \n literal.
          s = re.sub(r'\\n<!-- SPRINT58:.*?</script>\\n', '', s, flags=re.S)
          s = re.sub(r'(?m)^([ \t]*)\\n', r'\1', s)
          s = re.sub(r'(?m)^([ \t]*)\\r', r'\1', s)
          s = re.sub(r'(?m)^([ \t]*)\\t', r'\1', s)
          s = re.sub(r'\\n(?=\s*(?:<!--|<script|</script>|</body>|</html>))', '', s, flags=re.I)
          s = re.sub(r'\\\r?\n', '\n', s)

          marker = '<!-- SPRINT59: administração prática e expansão de siglas na pesquisa -->'
          if marker not in s:
              patch = """\n<!-- SPRINT59: administração prática e expansão de siglas na pesquisa -->\n<script id=\"sprint59-pesquisa-clinica\">\n(function(){\n  const SIGLAS={HVE:'Hipertrofia Ventricular Esquerda',AVC:'Acidente Vascular Cerebral',IAM:'Infarto Agudo do Miocárdio',SCA:'Síndrome Coronariana Aguda',PCR:'Parada Cardiorrespiratória',RCP:'Ressuscitação Cardiopulmonar',HAS:'Hipertensão Arterial Sistêmica',DM:'Diabetes Mellitus',DPOC:'Doença Pulmonar Obstrutiva Crônica',ICC:'Insuficiência Cardíaca Congestiva',IRC:'Insuficiência Renal Crônica',FA:'Fibrilação Atrial',PA:'Pressão Arterial',FC:'Frequência Cardíaca',FR:'Frequência Respiratória',SpO2:'Saturação periférica de oxigênio',AINE:'Anti-inflamatório não esteroidal',SNC:'Sistema Nervoso Central',IM:'Intramuscular',IV:'Intravenosa',EV:'Endovenosa',VO:'Via oral',SL:'Sublingual',SC:'Subcutânea',SF:'Soro fisiológico'};\n  function expandSiglas(v){let s=String(v??'');Object.keys(SIGLAS).forEach(k=>{const r=new RegExp('\\\\b'+k+'\\\\b(?!\\\\s*\\\\()','gi');s=s.replace(r,m=>m+' ('+SIGLAS[k]+')');});return s;}\n  function esc(v){if(typeof escHtmlAuth==='function')return escHtmlAuth(v);return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));}\n  function administracao(nome,med){const n=String(nome||'').toLowerCase(),ap=String(med?.apresentacao||'').toLowerCase(),via=String(med?.via||'').toLowerCase();if(n.includes('aas')||n.includes('ácido acetilsalicílico')||n.includes('acido acetilsalicilico'))return 'Via oral. Na suspeita de síndrome coronariana aguda (SCA), em adulto alerta e sem contraindicação, mastigar e engolir 162–325 mg. Para uso de rotina, seguir a dose prescrita. Não usar por via sublingual.';if(med?.administracao)return expandSiglas(med.administracao);if(ap.includes('comprim')||/\\b(via\\s*)?oral\\b|\\bvo\\b/i.test(via))return 'Via oral. Engolir com água. Não mastigar, triturar ou usar por via sublingual, exceto quando a apresentação/bula/protocolo indicar.';if(/\\bsublingual\\b|\\bsl\\b/i.test(via))return 'Via sublingual, colocar sob a língua e aguardar dissolução conforme apresentação/protocolo.';return 'Seguir a forma de administração específica da apresentação, bula e protocolo.';}\n  function card(med,q){const nome=med?.nome||q||'Medicamento';return '<div class=\"med-card\"><div class=\"med-card-header\"><div class=\"med-card-name\">💊 '+esc(nome)+'</div><span class=\"med-badge\">🇧🇷 Bula ANVISA</span></div><div class=\"med-card-body\"><div><div class=\"row-lbl\">📦 Apresentação</div><div class=\"row-val\">'+esc(expandSiglas(med?.apresentacao||'Não identificada'))+'</div></div><div class=\"divider\"></div><div><div class=\"row-lbl\">📌 Para que serve</div><div class=\"row-val\">'+esc(expandSiglas(med?.para_que_serve||'Não informado'))+'</div></div><div><div class=\"row-lbl\">💉 Via</div><div class=\"row-val\">'+esc(expandSiglas(med?.via||'Não informada'))+'</div></div><div><div class=\"row-lbl\">💊 Administração</div><div class=\"row-val\">'+esc(administracao(nome,med))+'</div></div><div><div class=\"row-lbl\">🧪 Diluente e preparo</div><div class=\"row-val\">'+esc(expandSiglas(med?.diluente||'Não aplicável'))+'</div></div><div><div class=\"row-lbl\">🔄 Flush</div><div class=\"row-val\">'+esc(expandSiglas(med?.flush||'Não aplicável'))+'</div></div></div></div>';}\n  window.executarBuscaForaMaleta=async function(){const input=document.getElementById('buscaForaMaletaInput'),btn=document.getElementById('buscaForaMaletaBtn'),result=document.getElementById('buscaForaMaletaResult');if(!input||!btn||!result)return;const q=input.value.trim();if(!q)return;btn.disabled=true;result.innerHTML='<div class=\"loading-wrap\"><div class=\"pulse-ring\"></div><p class=\"loading-text\">Consultando medicamento...</p></div>';try{const data=await callClaude(q),meds=Array.isArray(data?.medicamentos)?data.medicamentos:[];result.innerHTML=meds.length?meds.map(m=>card(m,q)).join(''):'<div class=\"error-box\">⚠️ Não foi possível obter uma ficha.</div>';}catch(e){result.innerHTML='<div class=\"error-box\">❌ Erro na pesquisa: '+esc(e.message||e)+'</div>';}finally{btn.disabled=false;}};\n})();\n</script>\n"""
              s=s.replace('</body>',patch+'</body>')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Verificar artefatos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          s=Path('index.html').read_text(encoding='utf-8')
          if re.search(r'(?m)^([ \t]*)\\n',s):
              print('ERRO: \n literal no início de linha');sys.exit(1)
          if re.search(r'\\n(?=\s*(?:<!--|<script|</script>|</body>|</html>))',s,re.I):
              print('ERRO: \n literal estrutural restante');sys.exit(1)
          print('OK: artefatos literais removidos.')
          PY

      - name: Commitar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: limpar escapes e corrigir administração na pesquisa"
          git push origin main
