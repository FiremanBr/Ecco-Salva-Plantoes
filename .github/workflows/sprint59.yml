name: Sprint59 - administração e siglas na pesquisa

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar Sprint59
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- SPRINT59: administração prática e expansão de siglas na pesquisa -->'
          if marker not in s:
              patch=r'''\n<!-- SPRINT59: administração prática e expansão de siglas na pesquisa -->\n<script id="sprint59-pesquisa-clinica">\n(function(){\n  const SIGLAS={\n    HVE:'Hipertrofia Ventricular Esquerda',AVC:'Acidente Vascular Cerebral',IAM:'Infarto Agudo do Miocárdio',\n    SCA:'Síndrome Coronariana Aguda',PCR:'Parada Cardiorrespiratória',RCP:'Ressuscitação Cardiopulmonar',\n    HAS:'Hipertensão Arterial Sistêmica',DM:'Diabetes Mellitus',DPOC:'Doença Pulmonar Obstrutiva Crônica',\n    ICC:'Insuficiência Cardíaca Congestiva',IRC:'Insuficiência Renal Crônica',FA:'Fibrilação Atrial',\n    PA:'Pressão Arterial',FC:'Frequência Cardíaca',FR:'Frequência Respiratória',SpO2:'Saturação periférica de oxigênio',\n    AINE:'Anti-inflamatório não esteroidal',SNC:'Sistema Nervoso Central',IM:'Intramuscular',IV:'Intravenosa',\n    EV:'Endovenosa',VO:'Via oral',SL:'Sublingual',SC:'Subcutânea',SF:'Soro fisiológico'\n  };\n  function expandSiglas(v){\n    let s=String(v??'');\n    Object.keys(SIGLAS).forEach(k=>{\n      const r=new RegExp('\\\\b'+k+'\\\\b(?!\\\\s*\\\\()','gi');\n      s=s.replace(r,(m)=>m+' ('+SIGLAS[k]+')');\n    });\n    return s;\n  }\n  function esc(v){\n    if(typeof escHtmlAuth==='function') return escHtmlAuth(v);\n    return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[c]));\n  }\n  function administracao(nome,med){\n    const n=String(nome||'').toLowerCase();\n    const ap=String(med?.apresentacao||'').toLowerCase();\n    const via=String(med?.via||'').toLowerCase();\n    if(n.includes('aas')||n.includes('ácido acetilsalicílico')||n.includes('acido acetilsalicilico')){\n      return 'Via oral. Na suspeita de síndrome coronariana aguda (SCA), em adulto alerta e sem contraindicação, mastigar e engolir 162–325 mg. Para uso de rotina, seguir a dose prescrita e engolir com água. Não usar por via sublingual.';\n    }\n    if(med?.administracao) return expandSiglas(med.administracao);\n    if(ap.includes('comprim')||/\\b(via\\s*)?oral\\b|\\bvo\\b/i.test(via)){\n      return 'Via oral. Engolir com água. Não mastigar, triturar ou usar por via sublingual, exceto quando a apresentação/bula/protocolo indicar especificamente.';\n    }\n    if(/\\bsublingual\\b|\\bsl\\b/i.test(via)) return 'Colocar sob a língua e aguardar dissolução, sem engolir imediatamente, conforme apresentação/protocolo.';\n    return 'Seguir a forma de administração específica da apresentação, bula e protocolo.';\n  }\n  function card(med,q){\n    const nome=med?.nome||q||'Medicamento';\n    return '<div class="med-card">'+\n      '<div class="med-card-header"><div class="med-card-name">💊 '+esc(nome)+'</div><span class="med-badge" style="background:rgba(59,155,232,0.15);color:var(--blue);border-color:rgba(59,155,232,0.3)">🇧🇷 Bula ANVISA</span></div>'+\n      '<div class="med-card-body">'+\n      '<div><div class="row-lbl">📦 Apresentação</div><div class="row-val">'+esc(expandSiglas(med?.apresentacao||'Não identificada'))+'</div></div>'+\n      '<div class="divider"></div>'+\n      '<div><div class="row-lbl">📌 Para que serve</div><div class="row-val">'+esc(expandSiglas(med?.para_que_serve||'Não informado'))+'</div></div>'+\n      '<div><div class="row-lbl">💉 Via</div><div class="row-val">'+esc(expandSiglas(med?.via||'Não informada'))+'</div></div>'+\n      '<div><div class="row-lbl">💊 Administração</div><div class="row-val">'+esc(administracao(nome,med))+'</div></div>'+\n      '<div><div class="row-lbl">🧪 Diluente e preparo</div><div class="row-val">'+esc(expandSiglas(med?.diluente||'Não aplicável'))+'</div></div>'+\n      '<div><div class="row-lbl">🔄 Flush</div><div class="row-val">'+esc(expandSiglas(med?.flush||'Não aplicável'))+'</div></div>'+\n      '<div class="divider"></div>'+\n      '<div class="interacao-box"><div class="interacao-title">⚠️ Efeitos no organismo</div><div class="interacao-item">'+esc(expandSiglas(med?.efeitos_corpo||'Não informado'))+'</div></div>'+\n      '</div></div>';\n  }\n  window.executarBuscaForaMaleta=async function(){\n    const input=document.getElementById('buscaForaMaletaInput'),btn=document.getElementById('buscaForaMaletaBtn'),result=document.getElementById('buscaForaMaletaResult');\n    if(!input||!btn||!result)return; const q=input.value.trim(); if(!q)return;\n    btn.disabled=true; result.innerHTML='<div class="loading-wrap"><div class="pulse-ring"></div><p class="loading-text">Consultando medicamento...</p></div>';\n    try{\n      const data=await callClaude(q); const meds=Array.isArray(data?.medicamentos)?data.medicamentos:[];\n      result.innerHTML=meds.length?meds.map(m=>card(m,q)).join(''):'<div class="error-box">⚠️ Não foi possível obter uma ficha para "'+esc(q)+'".</div>';\n    }catch(e){result.innerHTML='<div class="error-box">❌ Erro na pesquisa: '+esc(e.message||e)+'</div>';}\n    finally{btn.disabled=false;}\n  };\n  window.buscarLivre=async function(){\n    const input=document.getElementById('buscaInput'),result=document.getElementById('buscaResult'),btn=document.getElementById('buscaBtn');\n    if(!input||!result||!btn)return; const q=input.value.trim(); if(!q)return;\n    const local=MEDS.find(m=>m.toLowerCase()===q.toLowerCase());\n    if(local){result.innerHTML='<button class="btn-voltar" onclick="limparBusca()">← Voltar</button>'+buildCardFromDB(local);return;}\n    btn.disabled=true; result.innerHTML='<div class="loading-wrap"><div class="pulse-ring"></div><p class="loading-text">Consultando...</p></div>';\n    try{const data=await callClaude(q);let html='<button class="btn-voltar" onclick="limparBusca()">← Voltar</button>';\n      (Array.isArray(data?.medicamentos)?data.medicamentos:[]).forEach(m=>html+=card(m,q));\n      if(data?.compatibilidade) html+='<div class="compat-card"><div class="compat-header">🔀 Mesmo frasco de 100mL?</div><div class="compat-body">'+esc(expandSiglas(data.compatibilidade))+'</div></div>';\n      result.innerHTML=html;\n    }catch(e){result.innerHTML='<button class="btn-voltar" onclick="limparBusca()">← Voltar</button><div class="error-box">❌ Erro: '+esc(e.message||e)+'</div>';}\n    finally{btn.disabled=false;}\n  };\n})();\n</script>\n'''
              s=s.replace('</body>',patch+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commitar Sprint59
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "SPRINT59: administração e siglas na pesquisa"
          git push origin main
