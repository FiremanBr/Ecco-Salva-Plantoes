name: Fix Modo Estudo e favoritos
on:
  push:
    paths:
      - '.github/workflows/fix-modo-estudo-favorito.yml'
      - 'scripts/.study-fix-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Corrigir handler e restaurar ficha do Modo Estudo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove o bloco experimental que estava usando MutationObserver para
          # controlar as abas. Ele é a causa do bloqueio das demais abas.
          marker = '<!-- ECCO_ESTUDOS_MARKER_FINAL -->'
          if marker in s:
              prefix, suffix = s.split(marker, 1)
              suffix = re.sub(r'\s*<style>\s*#ecosalva-estudos-tab\.active.*?</style>', '', suffix, count=1, flags=re.S)
              suffix = re.sub(r'\s*<script>\s*\(function\(\)\{\s*var previousTab=null, guard=false;.*?</script>', '', suffix, count=1, flags=re.S)
              s = prefix + marker + suffix

          # Clique curto no medicamento apenas seleciona; favorito fica no toque longo.
          old = '''function handleMaletaMedClick(nome, el, ev) {
            // Clique normal: mantém a seleção/ficha e também garante a estrela de favorito.
            // O toque longo continua sendo usado para remover/adicionar manualmente.
            if (el && el.dataset && el.dataset.skipClick === '1') return;
            if (!_favoritos.has(nome)) toggleFavorito(nome, ev);
            toggleMed(nome, el);
          }'''
          new = '''function handleMaletaMedClick(nome, el, ev) {
            // Clique curto = selecionar o medicamento. Favorito NÃO é alterado.
            // Favorito continua sendo exclusivamente pelo toque/clique prolongado.
            if (el && el.dataset && el.dataset.skipClick === '1') return;
            toggleMed(nome, el);
            if (_modoEstudo) setTimeout(() => abrirPainelModoEstudo(), 0);
          }'''
          if old in s:
              s = s.replace(old, new, 1)

          # Cor exclusiva da aba Estudos, sem pseudo-elemento adicional.
          color_marker = '<!-- ECCO_ESTUDOS_COR_FINAL -->'
          if color_marker not in s:
              patch = '''
<!-- ECCO_ESTUDOS_COR_FINAL -->
<style>
#ecosalva-estudos-tab.active {
  color: #FF4FD8 !important;
  border-bottom-color: #FF4FD8 !important;
}
#ecosalva-estudos-tab.active::after {
  content: none !important;
  display: none !important;
}
</style>
'''
              s = s.replace('</body>', patch + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          print('CORRECAO_OK')
          PY
      - name: Commit e remover temporarios
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restaurar abas e corrigir Estudos' || true
          git push || true
          rm -f .github/workflows/fix-modo-estudo-favorito.yml scripts/.study-fix-trigger .github/workflows/fix-estudos-definitivo.yml
          git add -A
          git commit -m 'chore: remover workflows temporarios de Estudos' || exit 0
          git push
