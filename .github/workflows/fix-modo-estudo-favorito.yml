name: Fix Modo Estudo e favoritos
on:
  push:
    paths:
      - '.github/workflows/fix-modo-estudo-favorito.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Corrigir handler e restaurar ficha do Modo Estudo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''function handleMaletaMedClick(nome, el, ev) {
  // Clique normal: mantém a seleção/ficha e também garante a estrela de favorito.
  // O toque longo continua sendo usado para remover/adicionar manualmente.
  if (el && el.dataset && el.dataset.skipClick === '1') return;
  if (!_favoritos.has(nome)) toggleFavorito(nome, ev);
  toggleMed(nome, el);
}'''
          new = '''function handleMaletaMedClick(nome, el, ev) {
  // Clique curto = selecionar o medicamento. Favorito NÃO é alterado.
  // Favoritar continua sendo exclusivamente pelo toque/clique prolongado.
  if (el && el.dataset && el.dataset.skipClick === '1') return;
  toggleMed(nome, el);
  if (_modoEstudo) setTimeout(() => abrirPainelModoEstudo(), 0);
}'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'function handleMaletaMedClick(nome, el, ev)' not in s:
              raise SystemExit('Handler de medicamento nao encontrado; abortando.')

          marker = '<!-- ECCO_FIX_MODO_ESTUDO_V2 -->'
          if marker not in s:
              patch = r'''<!-- ECCO_FIX_MODO_ESTUDO_V2 -->
<style>
#modoEstudoPanel{display:none;margin:10px 0 14px;padding:10px 12px;background:var(--surface2);border:1px solid rgba(59,155,232,.35);border-radius:10px;box-sizing:border-box;width:100%}
#modoEstudoPanel.open{display:block}
#modoEstudoPanel .estudo-title{font-size:11px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
#modoEstudoPanel .estudo-item{margin-bottom:9px}
#modoEstudoPanel .estudo-item:last-child{margin-bottom:0}
</style>
<script>
(function(){
  window.abrirPainelModoEstudo=function(){
    const controls=document.getElementById('maletaControls');
    if(!controls)return;
    let panel=document.getElementById('modoEstudoPanel');
    if(!panel){
      panel=document.createElement('div');
      panel.id='modoEstudoPanel';
      controls.parentNode.insertBefore(panel,controls.nextSibling);
    }
    if(!_modoEstudo || !selecionados.size){
      panel.classList.remove('open');
      panel.innerHTML='';
      return;
    }
    const cards=[...selecionados].map(nome=>{
      try{return '<div class="estudo-item">'+buildCardFromDB(nome)+'</div>';}
      catch(e){return '<div class="estudo-item"><strong>💊 '+String(nome)+'</strong></div>';}
    }).join('');
    panel.innerHTML='<div class="estudo-title">📚 Ficha de estudo</div>'+cards;
    panel.classList.add('open');
  };

  const originalToggle=window.toggleModoEstudo;
  if(typeof originalToggle==='function'&&!originalToggle.__eccoStudyFix){
    const wrapped=function(){
      const r=originalToggle.apply(this,arguments);
      setTimeout(abrirPainelModoEstudo,0);
      return r;
    };
    wrapped.__eccoStudyFix=true;
    window.toggleModoEstudo=wrapped;
  }
})();
</script>
'''
              s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          print('OK')
          PY
      - name: Commit e remover workflow temporario
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restaurar Modo Estudo e toque longo dos favoritos'
          git push
          rm -f .github/workflows/fix-modo-estudo-favorito.yml
          git add -A
          git commit -m 'chore: remover workflow temporario do Modo Estudo'
          git push
