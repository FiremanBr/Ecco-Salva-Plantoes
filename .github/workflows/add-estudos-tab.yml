name: Add Estudos tab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-estudos-tab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-estudos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Estudos navigation and layout
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Remove the previous floating/modal implementation.
          text = re.sub(
              r'\s*<!-- ECOSALVA_ESTUDOS_TAB_V1 -->.*?</script>\s*',
              '\n',
              text,
              count=1,
              flags=re.S,
          )

          payload = r'''<!-- ECOSALVA_ESTUDOS_TAB_V2 -->
          <style>
            #ecosalva-estudos-tab{cursor:pointer}
            #ecosalva-estudos-area{display:none;margin:16px 0 24px}
            #ecosalva-estudos-area.open{display:block}
            .ecosalva-estudos-box{background:#111827;border:1px solid #334155;border-radius:14px;padding:16px;color:#e5e7eb}
            .ecosalva-estudos-title{font-size:18px;font-weight:800;margin:0 0 12px;color:#60a5fa}
            .ecosalva-estudo-card{background:#1e293b;border:1px solid #334155;border-radius:10px;margin-top:10px;overflow:hidden}
            .ecosalva-estudo-btn{width:100%;text-align:left;background:transparent;border:0;color:#e5e7eb;padding:14px 16px;font-size:16px;font-weight:800;cursor:pointer}
            .ecosalva-estudo-btn::after{content:'＋';float:right;font-size:18px}
            .ecosalva-estudo-btn.open::after{content:'−'}
            .ecosalva-estudo-content{display:none;padding:0 16px 16px;color:#cbd5e1;line-height:1.55}
            .ecosalva-estudo-content.open{display:block}
            .ecosalva-estudo-content p{margin:8px 0}
            @media(max-width:600px){.ecosalva-estudos-box{padding:12px}.ecosalva-estudo-btn{font-size:15px}}
          </style>
          <script>
          (function(){
            function makeStudies(){
              if(document.getElementById('ecosalva-estudos-tab')) return;

              var candidates=Array.from(document.querySelectorAll('button,a,[role="button"],div'));
              var target=candidates.find(function(el){
                var t=(el.textContent||'').trim();
                return /^.*Segurança.*$/.test(t) && t.length < 40;
              });

              var tab=document.createElement(target ? target.tagName.toLowerCase() : 'button');
              tab.id='ecosalva-estudos-tab';
              tab.type='button';
              tab.textContent='📚 Estudos';
              tab.setAttribute('aria-label','Abrir Estudos');
              if(target){
                tab.className=target.className;
                tab.style.cssText=target.style.cssText;
                target.parentElement.appendChild(tab);
              }else{
                tab.style.cssText='display:block;margin:8px 0;padding:8px 14px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e5e7eb;font-weight:700;';
                document.body.prepend(tab);
              }

              var area=document.createElement('section');
              area.id='ecosalva-estudos-area';
              area.innerHTML='<div class="ecosalva-estudos-box">'+
                '<div class="ecosalva-estudos-title">📚 Estudos</div>'+
                '<div class="ecosalva-estudo-card">'+
                  '<button class="ecosalva-estudo-btn" type="button">Nove Certos da Enfermagem</button>'+
                  '<div class="ecosalva-estudo-content">'+
                    '<p><strong>1. Paciente certo:</strong> confirmar a identificação correta do paciente.</p>'+
                    '<p><strong>2. Medicamento certo:</strong> conferir nome, apresentação e concentração.</p>'+
                    '<p><strong>3. Dose certa:</strong> verificar a dose prescrita e os cálculos necessários.</p>'+
                    '<p><strong>4. Via certa:</strong> confirmar a via de administração prescrita.</p>'+
                    '<p><strong>5. Horário certo:</strong> administrar no horário ou aprazamento correto.</p>'+
                    '<p><strong>6. Registro certo:</strong> registrar corretamente a administração e eventuais intercorrências.</p>'+
                    '<p><strong>7. Indicação/razão certa:</strong> confirmar se o medicamento é adequado à indicação clínica.</p>'+ 
                    '<p><strong>8. Resposta certa:</strong> avaliar o efeito esperado e possíveis reações após a administração.</p>'+
                    '<p><strong>9. Forma/apresentação certa:</strong> conferir a apresentação, formulação e características do medicamento antes de administrar.</p>'+
                    '<p><strong>Memorização rápida:</strong> Paciente → Medicamento → Dose → Via → Horário → Registro → Indicação → Resposta → Forma.</p>'+
                  '</div>'+ 
                '</div>'+ 
              '</div>';

              var nav=target ? target.parentElement : document.body;
              nav.parentElement ? nav.parentElement.insertBefore(area,nav.nextSibling) : document.body.appendChild(area);

              tab.addEventListener('click',function(){
                area.classList.toggle('open');
                if(area.classList.contains('open')) area.scrollIntoView({behavior:'smooth',block:'start'});
              });

              var studyBtn=area.querySelector('.ecosalva-estudo-btn');
              var content=area.querySelector('.ecosalva-estudo-content');
              studyBtn.addEventListener('click',function(){
                studyBtn.classList.toggle('open');
                content.classList.toggle('open');
              });
            }

            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',makeStudies); else makeStudies();
          })();
          </script>'''

          if re.search(r'</body\s*>', text, flags=re.I):
              text = re.sub(r'</body\s*>', payload + '\n</body>', text, count=1, flags=re.I)
          else:
              text += '\n' + payload + '\n'

          path.write_text(text, encoding='utf-8')
          print('Estudos layout updated')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: integrate Estudos into navigation and use expandable study list'
          git push
