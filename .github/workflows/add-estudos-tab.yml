name: Add Estudos tab
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-estudos-tab.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Corrigir aba Estudos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- ECCO_FIX_ABA_ESTUDOS_ATIVA_V1 -->'
          if marker not in s:
              patch=r'''<!-- ECCO_FIX_ABA_ESTUDOS_ATIVA_V1 -->
<style>
/* Indicador visual da aba Estudos ativa. */
.ecco-tab-estudos-ativa,
[data-tab="estudos"].active,
[data-tab="estudos"].selected,
[data-tab="estudos"].aba-ativa,
.tab-estudos.active,
.tab-estudos.selected{
  border-bottom:3px solid var(--blue,#3b9be8) !important;
  box-shadow:inset 0 -3px 0 var(--blue,#3b9be8) !important;
}
</style>
<script>
(function(){
  function marcarEstudos(){
    const candidatos=[...document.querySelectorAll('a,button,div,span')];
    candidatos.forEach(function(el){
      const txt=(el.textContent||'').replace(/\s+/g,' ').trim();
      if(!txt || !/📚?\s*Estudos/.test(txt)) return;
      const ativo=el.classList.contains('active')||el.classList.contains('selected')||el.classList.contains('aba-ativa')||el.getAttribute('aria-current')==='page';
      const vis=el.offsetParent!==null;
      if(vis && ativo) el.classList.add('ecco-tab-estudos-ativa');
      else if(!ativo) el.classList.remove('ecco-tab-estudos-ativa');
    });
  }
  marcarEstudos();
  new MutationObserver(marcarEstudos).observe(document.body,{attributes:true,attributeFilter:['class','aria-current'],childList:true,subtree:true});
})();
</script>
'''
              s=s.replace('</body>',patch+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          print('OK')
          PY
      - name: Commit correcao
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: destacar aba Estudos quando ativa'
          git push
