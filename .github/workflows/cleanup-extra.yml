name: Remove extra temporary files
on:
  push:
    paths:
      - '.github/workflows/cleanup-extra.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          rm -f scripts/.verify scripts/.final-clean .github/workflows/cleanup-extra.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remover ultimos artefatos temporarios' || true
          git push