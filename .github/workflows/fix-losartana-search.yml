name: Fix medication search deterministic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace medication search block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<script id="sprint61-medicamento-search-clean">[\s\S]*?</script>'
          if not re.search(pattern, s):
              raise SystemExit('Bloco SPRINT61 não encontrado; nenhuma alteração aplicada.')

          block = r'''<script id="sprint61-medicamento-search-clean">
          (function(){
            // SPRINT61 FINAL: a pesquisa da Maleta não depende de IA para
            // medicamentos conhecidos. A Maleta (MEDS_DB) não é alterada.
            const COMERCIAIS={
              'AAS':['Aspirina'],'Dipirona':['Novalgina','Anador','Magnopyrol'],'Paracetamol':['Tylenol'],
              'Captopril':['Capoten'],'Losartana':['Cozaar'],'Prednisona':['Meticorten'],'Furosemida':['Lasix'],
              'Amiodarona':['Ancoron','Atlansil'],'Metoprolol':['Lopressor','Seloken'],'Sustrate':['Sustrate'],
              'Clonidina':['Atensina'],'Toragesic':['Toragesic'],'Adrenalina':['Adren'],'Atropina':['Atropion'],
              'Cetoprofeno EV':['Profenid'],'Cetoprofeno IM':['Profenid'],'Buscopan C.':['Buscopan Composto'],
              'Buscopan S.':['Buscopan'],'Metoclopramida':['Plasil'],'Salbutamol':['Aerolin'],'Adenosina':['Adenocard'],
              'Ondansetrona':['Vonau','Zofran'],'Prometazina':['Fenergan'],'Dexametasona':['Decadron'],
              'Terbutalina':['Bricanyl'],'Fenitoína':['Hidantal'],'Diazepam Inj.':['Valium'],'Diazepam Comp.':['Valium'],
              'Tramadol':['Tramal'],'Haloperidol':['Haldol'],'Biperideno':['Akineton'],'Flumazenil':['Lanexat'],
              'Clorpromazina':['Amplictil'],'Morfina':['Dimorf'],'Fentanila':['Sublimaze'],'Deslanosídeo':['Cedilanide'],
              'Dopamina':['Revivan'],'Narcan':['Narcan']
            };

            // Banco COMPLEMENTAR apenas para pesquisa. Não adiciona nada à Maleta.
            const EXTRAS={
              'Losartana':{
                nome:'Losartana Potássica',
                apresentacao:'Comprimidos — 50 mg (a apresentação pode variar conforme o fabricante)',
                indicacao:'Hipertensão arterial; redução do risco de acidente vascular cerebral em pacientes hipertensos com hipertrofia ventricular esquerda; proteção renal em determinados pacientes com diabetes tipo 2 e hipertensão.',
                via:'VO — via oral',
                administracao:'Via oral. Engolir com água, conforme prescrição e apresentação.',
                diluicao:'Não aplicável — medicamento de uso oral.',
                flush:'Não aplicável — via oral.',
                cor:'#22C97A',
                comercial:['Cozaar']
              }
            };

            const ALIAS={
              cozaar:'Losartana',losartana:'Losartana',losartan:'Losartana',lozartana:'Losartana',
              losaetana:'Losartana',losartanna:'Losartana',losartna:'Losartana',
              aspirina:'AAS',novalgina:'Dipirona',anador:'Dipirona',magnopyrol:'Dipirona',tylenol:'Paracetamol',
              capoten:'Captopril',meticorten:'Prednisona',lasix:'Furosemida',ancoron:'Amiodarona',atlansil:'Amiodarona',
              lopressor:'Metoprolol',seloken:'Metoprolol',atensina:'Clonidina',adren:'Adrenalina',atropion:'Atropina',
              profenid:'Cetoprofeno EV','buscopan composto':'Buscopan C.',buscopan:'Buscopan S.',plasil:'Metoclopramida',
              aerolin:'Salbutamol',adenocard:'Adenosina',vonau:'Ondansetrona',zofran:'Ondansetrona',fenergan:'Prometazina',
              decadron:'Dexametasona',bricanyl:'Terbutalina',hidantal:'Fenitoína',valium:'Diazepam Inj.',tramal:'Tramadol',
              haldol:'Haloperidol',akineton:'Biperideno',lanexat:'Flumazenil',amplictil:'Clorpromazina',dimorf:'Morfina',
              sublimaze:'Fentanila',cedilanide:'Deslanosídeo',revivan:'Dopamina',narcan:'Narcan'
            };

            function norm(v){
              return String(v||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
                .toLowerCase().replace(/[^a-z0-9. ]/g,'').replace(/\s+/g,' ');
            }
            function dist(a,b){
              const d=Array.from({length:a.length+1},(_,i)=>{const r=new Array(b.length+1);r[0]=i;return r});
              for(let j=1;j<=b.length;j++)d[0][j]=j;
              for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
                d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
              return d[a.length][b.length];
            }
            function fuzzyKey(q,keys){
              const nq=norm(q); if(!nq)return null;
              let k=keys.find(x=>norm(x)===nq); if(k)return k;
              if(ALIAS[nq] && keys.includes(ALIAS[nq])) return ALIAS[nq];
              k=keys.find(x=>{const nx=norm(x);return nx.startsWith(nq)||nq.startsWith(nx)}); if(k)return k;
              let best=null,bd=99;
              for(const x of keys){
                const nx=norm(x); if(nx.length<4)continue;
                const dd=dist(nq,nx);
                if(dd<bd){bd=dd;best=x;}
              }
              const limite=nq.length<=5?1:nq.length<=8?2:Math.max(2,Math.floor(nq.length*0.25));
              return bd<=limite?best:null;
            }
            function localKey(q){
              if(typeof MEDS_DB==='undefined')return null;
              return fuzzyKey(q,Object.keys(MEDS_DB));
            }
            function extraKey(q){
              const k=fuzzyKey(q,Object.keys(EXTRAS));
              return k&&EXTRAS[k]?k:null;
            }
            function esc(v){
              if(typeof escHtmlAuth==='function')return escHtmlAuth(v);
              return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            }
            function renderLocal(nome,out){
              if(!nome||typeof buildCardFromDB!=='function')return false;
              let h=buildCardFromDB(nome);
              if(!h)return false;
              const arr=COMERCIAIS[nome]||[];
              if(arr.length)h=h.replace(/(<div class="med-card-name">.*?<\/div>)/,
                '$1<div class="sprint61-commercial"><span>🏷️ NOME COMERCIAL</span><strong>'+arr.map(esc).join(' · ')+'</strong></div>');
              out.innerHTML='<button class="btn-voltar" onclick="limparBusca()">← Voltar</button>'+h;
              return true;
            }
            function renderExtra(nome,out){
              const m=EXTRAS[nome]; if(!m)return false;
              const comercial=(m.comercial||[]).map(esc).join(' · ');
              out.innerHTML='<button class="btn-voltar" onclick="limparBusca()">← Voltar</button>'+
                '<div class="med-card">'+
                '<div class="med-card-header" style="background:'+m.cor+'22;border-bottom-color:'+m.cor+'44">'+
                '<div class="med-card-name">💊 '+esc(m.nome)+'</div><span class="med-badge">🔎 Pesquisa clínica</span></div>'+
                '<div class="med-card-body">'+
                (comercial?'<div class="sprint61-commercial"><span>🏷️ NOME COMERCIAL</span><strong>'+comercial+'</strong></div><div class="divider"></div>':'')+
                '<div><div class="row-lbl">📦 Apresentação</div><div class="row-val">'+esc(m.apresentacao)+'</div></div>'+ 
                '<div class="divider"></div><div><div class="row-lbl">📌 Indicação</div><div class="row-val">'+esc(m.indicacao)+'</div></div>'+ 
                '<div><div class="row-lbl">💉 Via</div><div class="row-val">'+esc(m.via)+'</div></div>'+ 
                '<div><div class="row-lbl">💊 Administração</div><div class="row-val">'+esc(m.administracao)+'</div></div>'+ 
                '<div><div class="row-lbl">🧪 Diluente e preparo</div><div class="row-val">'+esc(m.diluicao)+'</div></div>'+ 
                '<div><div class="row-lbl">🔄 Flush</div><div class="row-val">'+esc(m.flush)+'</div></div>'+ 
                '</div></div>';
              return true;
            }

            const fallback=window.buscarLivre;
            window.buscarLivre=async function(){
              const input=document.getElementById('buscaInput');
              const out=document.getElementById('buscaResult');
              const q=input&&input.value?input.value.trim():'';
              if(!q||!out)return;
              const lk=localKey(q);
              if(lk&&renderLocal(lk,out))return;
              const ek=extraKey(q);
              if(ek&&renderExtra(ek,out))return;
              if(typeof fallback==='function')return fallback.apply(this,arguments);
              out.innerHTML='<div class="error-box">⚠️ Medicamento não encontrado na base local.</div>';
            };
          })();
          </script>'''

          s2 = re.sub(pattern, lambda m: block, s, count=1)
          if s2 == s:
              raise SystemExit('Nenhuma alteração feita.')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'Sem mudanças'; exit 0; }
          git commit -m "fix: busca de medicamentos deterministica e nome comercial [MED-SEARCH-FINAL]"
          git push
          git rm .github/workflows/fix-losartana-search.yml
          git commit -m "chore: remover workflow temporario de correcao"
          git push
