name: Fix AAS search

on:
  push:
    paths:
      - '.github/workflows/fix-aas-search.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Corrigir correspondencia AAS e busca exata
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='SPRINT64: busca por sinonimos e correspondencia exata ANVISA'
          if marker in s:
              print('SPRINT64 ja aplicado')
              raise SystemExit(0)
          patch=r'''<!-- SPRINT64: busca por sinonimos e correspondencia exata ANVISA -->
          <script id="sprint64-anvisa-search-precision">
          (function(){
            const URL_BASE='anvisa-medicamentos.json'; let cache=null;
            function norm(v){return String(v||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
            function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
            const ALIASES={
              'aas':'acido acetilsalicilico','asa':'acido acetilsalicilico','aspirina':'acido acetilsalicilico',
              'acido acetilsalicilico':'acido acetilsalicilico','acido acetilsalicilico':'acido acetilsalicilico'
            };
            async function load(){if(cache)return cache;const r=await fetch(URL_BASE+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Base ANVISA indisponivel');const j=await r.json();cache=j.registros||[];return cache;}
            function ativo(x){return norm(x.situacao)==='ativo'||!x.situacao;}
            function score(x,q){
              const n=norm(x.nome), a=norm(x.principio_ativo), nq=ALIASES[q]||q;
              if(n===nq || a===nq) return 1000;
              if(n.startsWith(nq) || a.startsWith(nq)) return 800;
              if(n.includes(nq) || a.includes(nq)) return 500;
              return 0;
            }
            function key(x){return norm(x.principio_ativo||x.nome);}
            function add(arr,v){if(v&&!arr.some(z=>norm(z)===norm(v)))arr.push(String(v).trim());}
            function card(g){
              const names=[],pres=[],forms=[],vias=[],classes=[],cats=[];
              g.rows.forEach(x=>{add(names,x.nome);add(pres,x.apresentacao);add(forms,x.forma_farmaceutica);add(vias,x.via);add(classes,x.classe);add(cats,x.categoria);});
              const display=g.principio||names[0]||'Medicamento';
              let h='<div class="med-card" style="margin:10px 0;padding:0;border:1px solid #2b3a52;border-radius:18px;overflow:hidden;background:rgba(18,27,43,.92)">';
              h+='<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid #2b3a52"><div style="font-size:20px;font-weight:900">💊 '+esc(display.toUpperCase())+'</div><span style="font-size:12px;font-weight:800;color:#35c98a;border:1px solid #176b4e;border-radius:7px;padding:5px 8px">🇧🇷 ANVISA</span></div><div style="padding:4px 16px 14px">';
              h+='<div style="padding:10px 0;border-bottom:1px solid #2b3a52"><div style="font-size:12px;font-weight:900;color:#69b9ff">PRINCÍPIO ATIVO</div><div style="font-size:17px;margin-top:5px">'+esc(g.principio||display)+'</div></div>';
              if(names.length)h+='<div style="padding:10px 0;border-bottom:1px solid #2b3a52"><div style="font-size:12px;font-weight:900;color:#69b9ff">🏷️ NOMES COMERCIAIS / PRODUTOS REGISTRADOS</div><div style="font-size:16px;line-height:1.65;margin-top:5px">'+names.map(n=>'<span style="display:inline-block;margin:2px 6px 2px 0;padding:4px 9px;border-radius:8px;background:#17243a">'+esc(n)+'</span>').join('')+'</div></div>';
              if(classes.length)h+='<div style="padding:10px 0;border-bottom:1px solid #2b3a52"><div style="font-size:12px;font-weight:900;color:#69b9ff">CLASSE TERAPÊUTICA</div><div style="font-size:16px;margin-top:5px">'+esc(classes.join(' • '))+'</div></div>';
              if(cats.length)h+='<div style="padding:10px 0;border-bottom:1px solid #2b3a52"><div style="font-size:12px;font-weight:900;color:#69b9ff">CATEGORIA</div><div style="font-size:16px;margin-top:5px">'+esc(cats.join(' • '))+'</div></div>';
              if(pres.length)h+='<div style="padding:10px 0;border-bottom:1px solid #2b3a52"><div style="font-size:12px;font-weight:900;color:#69b9ff">APRESENTAÇÕES ENCONTRADAS</div><div style="font-size:16px;line-height:1.5;margin-top:5px">'+esc(pres.join(' • '))+'</div></div>';
              if(forms.length)h+='<div style="padding:10px 0;border-bottom:1px solid #2b3a52"><div style="font-size:12px;font-weight:900;color:#69b9ff">FORMA FARMACÊUTICA</div><div style="font-size:16px;margin-top:5px">'+esc(forms.join(' • '))+'</div></div>';
              if(vias.length)h+='<div style="padding:10px 0;border-bottom:1px solid #2b3a52"><div style="font-size:12px;font-weight:900;color:#69b9ff">VIA DE ADMINISTRAÇÃO</div><div style="font-size:16px;margin-top:5px">'+esc(vias.join(' • '))+'</div></div>';
              h+='<div style="padding:10px 0"><div style="font-size:12px;font-weight:900;color:#69b9ff">📚 INFORMAÇÕES CLÍNICAS OFICIAIS</div><div style="font-size:15px;line-height:1.45;margin-top:5px">Indicações, posologia, contraindicações, advertências, preparo e administração devem ser consultados na bula profissional vigente da ANVISA.</div><a href="https://consultas.anvisa.gov.br/#/bulario/" target="_blank" rel="noopener" style="display:inline-block;margin-top:9px;padding:9px 12px;border-radius:9px;text-decoration:none;background:#1677d2;color:white;font-weight:800">📄 Abrir Bulário ANVISA</a></div>';
              h+='<div style="font-size:11px;opacity:.7;padding-top:2px">Fonte: ANVISA — somente registros ativos.</div></div></div>';return h;
            }
            window.executarBuscaForaMaleta=async function(){
              const input=document.getElementById('buscaForaMaletaInput'),out=document.getElementById('buscaForaMaletaResult');const q=input&&input.value?input.value.trim():'';if(!q||!out)return;
              out.innerHTML='<div class="loading-wrap">🔎 Consultando base oficial da ANVISA...</div>';
              try{
                const data=await load(),pool=data.filter(ativo),nq=norm(q),target=ALIASES[nq]||nq;
                let scored=pool.map(x=>({x,s:score(x,nq)})).filter(o=>o.s>0).sort((a,b)=>b.s-a.s);
                if(scored.length && scored[0].s>=1000){scored=scored.filter(o=>o.s>=500 && (norm(o.x.nome).includes(target)||norm(o.x.principio_ativo).includes(target)));}
                const rows=scored.slice(0,80).map(o=>o.x),groups=new Map();
                rows.forEach(x=>{const k=key(x);if(!groups.has(k))groups.set(k,{principio:x.principio_ativo||x.nome,rows:[]});groups.get(k).rows.push(x);});
                const gs=[...groups.values()].slice(0,8);
                out.innerHTML='<button class="btn-voltar" onclick="limparBusca()">← Voltar</button>';
                if(!gs.length){out.innerHTML+='<div class="error-box">⚠️ Medicamento não encontrado na base oficial de medicamentos ativos da ANVISA.</div>';return;}
                out.innerHTML+='<div style="font-size:13px;font-weight:800;margin:8px 0 4px">Resultados oficiais da ANVISA — consolidados</div>'+gs.map(card).join('');
              }catch(e){console.error(e);out.innerHTML='<div class="error-box">⚠️ Não foi possível consultar a base oficial da ANVISA agora.</div>';}
            };
          })();
          </script>
          '''
          s=s.replace('</body>',patch+'\n</body>') if '</body>' in s else s+'\n'+patch
          p.write_text(s,encoding='utf-8')
          print('SPRINT64 aplicado')
      - name: Commit e remover workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: corrigir busca exata de AAS e sinonimos' || true
          git push
          rm -f .github/workflows/fix-aas-search.yml
          git add .github/workflows/fix-aas-search.yml
          git commit -m 'chore: remover workflow temporario de busca' || true
          git push
