name: Patch UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Sprint58 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- SPRINT58: administração prática, siglas expandidas e limpeza de artefato -->'
          if marker not in s:
              patch=r'''\n<!-- SPRINT58: administração prática, siglas expandidas e limpeza de artefato -->\n<script id="sprint58-clinica-ui">\n(function(){\n  const expand=function(x){\n    if(x==null)return ''; let s=String(x);\n    const m={HVE:'Hipertrofia Ventricular Esquerda',AVC:'Acidente Vascular Cerebral',IAM:'Infarto Agudo do Miocárdio',SCA:'Síndrome Coronariana Aguda',PCR:'Parada Cardiorrespiratória',RCP:'Ressuscitação Cardiopulmonar',HAS:'Hipertensão Arterial Sistêmica',DM:'Diabetes Mellitus',DPOC:'Doença Pulmonar Obstrutiva Crônica',ICC:'Insuficiência Cardíaca Congestiva',IRC:'Insuficiência Renal Crônica',FA:'Fibrilação Atrial',PA:'Pressão Arterial',FC:'Frequência Cardíaca',FR:'Frequência Respiratória',SpO2:'Saturação periférica de oxigênio',AINE:'Anti-inflamatório não esteroidal',SNC:'Sistema Nervoso Central'};\n    Object.keys(m).forEach(k=>{const r=new RegExp('\\\\b'+k+'\\\\b(?!\\\\s*\\\\()','g');s=s.replace(r,k+' ('+m[k]+')')}); return s;\n  };\n  const admin=function(nome,med){\n    const n=String(nome||'').toLowerCase();\n    if(n.includes('aas')||n.includes('ácido acetilsalicílico')||n.includes('acido acetilsalicilico')) return 'Via oral. Na suspeita de síndrome coronariana aguda (SCA), em adulto alerta e sem contraindicação, mastigar e engolir 162–325 mg. Não usar por via sublingual.';\n    if(med&&med.administracao)return expand(med.administracao);\n    const via=String((med&&med.via)||'').toLowerCase(), ap=String((med&&med.apresentacao)||'').toLowerCase();\n    if(ap.includes('comprimido')||/\\bvo\\b|oral/.test(via))return 'Via oral. Engolir, mastigar ou usar por via sublingual somente quando a apresentação/bula/protocolo indicar especificamente.';\n    return 'Seguir a forma de administração específica da apresentação e do protocolo.';\n  };\n  const oldBuild=window.buildCardFromDB;\n  if(typeof oldBuild==='function'){\n    window.buildCardFromDB=function(nome){\n      let h=oldBuild(nome); const med=window.MEDS_DB&&MEDS_DB[nome];\n      if(!h)return h;\n      h=h.replace(/(<div><div class="row-lbl">📌 Indicação<\\/div><div class="row-val">)(.*?)(<\\/div><\\/div>)/,(_,a,b,c)=>a+expand(b)+c);\n      h=h.replace(/(<div><div class="row-lbl">💉 Via<\\/div><div class="row-val">)(.*?)(<\\/div><\\/div>)/,(_,a,b,c)=>a+expand(b)+c+'<div><div class="row-lbl">💊 Administração</div><div class="row-val">'+admin(nome,med)+'</div></div>');\n      return h.replace(/(<div class="row-lbl">🧪 Preparo \/ Flush<\\/div><div class="row-val">)(.*?)(<\\/div><\\/div>)/,(_,a,b,c)=>a+expand(b)+c);\n    };\n  }\n  window.buscarLivre=async function(){\n    const q=(document.getElementById('buscaInput')||{}).value?.trim(); if(!q)return;\n    const out=document.getElementById('buscaResult'); if(!out)return;\n    out.innerHTML='<div class="loading-wrap"><div class="pulse-ring"></div><p class="loading-text">Consultando...</p></div>';\n    try{\n      const data=await callClaude(q); let html='<button class="btn-voltar" onclick="limparBusca()">← Voltar</button>';\n      (data.medicamentos||[]).forEach(med=>{\n        const n=String(med.nome||q); const adm=admin(n,med);\n        html+='<div class="med-card"><div class="med-card-header"><div class="med-card-name">💊 '+n+'</div><span class="med-badge">'+(med.fonte||'Literatura geral')+'</span></div><div class="med-card-body">'+\n        '<div><div class="row-lbl">📦 Apresentação</div><div class="row-val">'+expand(med.apresentacao)+'</div></div><div class="divider"></div>'+\n        '<div><div class="row-lbl">📌 Para que serve</div><div class="row-val">'+expand(med.para_que_serve)+'</div></div>'+\n        '<div><div class="row-lbl">💊 Administração</div><div class="row-val">'+adm+'</div></div>'+\n        '<div><div class="row-lbl">💉 Via</div><div class="row-val">'+expand(med.via)+'</div></div>'+\n        '<div><div class="row-lbl">🧪 Diluente e preparo</div><div class="row-val">'+expand(med.diluente)+'</div></div>'+\n        '<div><div class="row-lbl">🔄 Flush</div><div class="row-val">'+expand(med.flush)+'</div></div><div class="divider"></div>'+\n        '<div class="interacao-box"><div class="interacao-title">⚠️ Efeitos no organismo</div><div class="interacao-item">'+expand(med.efeitos_corpo)+'</div></div></div></div>';\n      });\n      out.innerHTML=html;\n    }catch(e){out.innerHTML='<button class="btn-voltar" onclick="limparBusca()">← Voltar</button><div class="error-box">❌ Erro: '+e.message+'</div>'}\n  };\n  function limpar(){\n    const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),rm=[];\n    while(w.nextNode()){const n=w.currentNode,v=n.nodeValue||'';if(/^(?:\\\\n){2,}$/.test(v)||/^\\\\n\\\\s*\\\\n\\\\s*\\\\n$/.test(v))rm.push(n)}\n    rm.forEach(n=>n.parentNode&&n.parentNode.removeChild(n));\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',limpar);else limpar();\n  new MutationObserver(limpar).observe(document.body,{childList:true,subtree:true});\n})();\n</script>\n'''
              s=s.replace('</body>',patch+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit Sprint58
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "SPRINT58: administração, siglas e limpeza"
          git push
