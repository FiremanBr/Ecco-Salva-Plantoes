name: Patch UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- SPRINT57: camera exclusiva na Analise + busca exclusiva na Maleta + parser JSON robusto -->'
          if marker not in s:
              patch = r'''\n<!-- SPRINT57: camera exclusiva na Analise + busca exclusiva na Maleta + parser JSON robusto -->\n<script id="sprint57-camera-busca">\n(function(){\n  function limparBuscaDaAnalise(){\n    var painel = document.getElementById('panel-analise');\n    if (!painel) return;\n    painel.querySelectorAll('button').forEach(function(b){\n      var txt = ((b.textContent||'') + ' ' + (b.getAttribute('aria-label')||'') + ' ' + (b.getAttribute('title')||'') + ' ' + (b.getAttribute('onclick')||'')).toLowerCase();\n      if (/pesquisar\\s+medicamento|buscar\\s+medicamento|abrirbusca|buscarlivre/.test(txt)) b.remove();\n    });\n    var campo = document.getElementById('anMedsContinuos');\n    if (campo && !campo.parentElement.querySelector('button[onclick*="abrirCamera"]')) {\n      var b = document.createElement('button');\n      b.type='button'; b.textContent='📸'; b.title='Fotografar receita ou tela'; b.setAttribute('aria-label','Fotografar receita ou tela');\n      b.onclick=function(){ if(typeof abrirCamera==='function') abrirCamera(); };\n      b.style.cssText='position:absolute;bottom:8px;right:8px;background:var(--surface3);border:1px solid var(--border);border-radius:7px;padding:6px 8px;cursor:pointer;font-size:18px;line-height:1';\n      campo.parentElement.appendChild(b);\n    }\n  }\n  function corrigir(){ limparBuscaDaAnalise(); }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', corrigir); else corrigir();\n  setTimeout(corrigir,100); setTimeout(corrigir,500); setTimeout(corrigir,1500);\n  new MutationObserver(corrigir).observe(document.body,{childList:true,subtree:true});\n\n  function extrairJSON(texto){\n    var t=String(texto||'').replace(/```(?:json)?/gi,'').replace(/```/g,'').trim();\n    var inicio=t.indexOf('{');\n    if(inicio<0) throw new Error('JSON não encontrado na resposta');\n    var profundidade=0, emString=false, escape=false;\n    for(var i=inicio;i<t.length;i++){\n      var c=t[i];\n      if(emString){ if(escape) escape=false; else if(c==='\\\\') escape=true; else if(c==='"') emString=false; continue; }\n      if(c==='"'){emString=true;continue;}\n      if(c==='{') profundidade++;\n      else if(c==='}') { profundidade--; if(profundidade===0){ var candidato=t.slice(inicio,i+1); try{return JSON.parse(candidato);}catch(e){}} }\n    }\n    try{return JSON.parse(t.slice(inicio,t.lastIndexOf('}')+1));}catch(e){throw new Error('Resposta JSON inválida');}\n  }\n  window.callClaude = async function(query){\n    var GROQ_KEY=getGroqKey();\n    var res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},body:JSON.stringify({model:'qwen/qwen3.6-27b',max_tokens:4000,temperature:0.3,messages:[{role:'system',content:SYSTEM_BUSCA},{role:'user',content:'Consulta: '+query}]})});\n    if(res.status===401){invalidarGroqKey();throw new Error('Chave Groq inválida ou expirada. Gere uma nova chave e tente novamente.');}\n    if(res.status===429) throw new Error('Muitas requisições. Aguarde alguns segundos e tente de novo.');\n    if(!res.ok) throw new Error('Erro HTTP '+res.status);\n    var data=await res.json();\n    var raw=(data&&data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content||'').trim();\n    if(!raw) throw new Error('Resposta inválida');\n    return extrairJSON(raw);\n  };\n})();\n</script>\n'''
              s = s.replace('</body>', patch + '</body>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: camera na analise e busca na maleta"
          git push
