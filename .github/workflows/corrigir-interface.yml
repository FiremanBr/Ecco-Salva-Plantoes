name: Corrigir interface

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar correções definitivas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Corrige sequências literais de escape que estavam aparecendo na tela.
          marker = "// Formatar texto: siglas em maiúsculo, palavras com 1ª letra maiúscula\n"
          if 'function limparSaidaGerada' not in s and marker in s:
              patch = r'''function limparSaidaGerada(valor) {
                return String(valor ?? '')
                  .replace(/\\n+/g, ' ')
                  .replace(/\\r+/g, ' ')
                  .replace(/\\t+/g, ' ')
                  .replace(/ {2,}/g, ' ')
                  .trim();
              }

              function sanitizarHTMLGerado(html) {
                return limparSaidaGerada(html);
              }

              '''
              s = s.replace(marker, patch + marker, 1)

          # Expande as siglas clínicas pedidas.
          old_sig = "const siglas = ['PA','FC','FR','SPO2','HGT','ECG','AVC','IAM','PCR','DM','HAS','ICC','DPOC','AVCI','TCE','TVP','TEP','SAMU','APH','SCA','EV','IM','SC','SL','VO','SF','SG','BPM','AAS','RCP','UTI','UPA','UBS','SSVV','GCS','SNS','AVCH','AVE','VM','O2','SAT'];"
          if old_sig in s and 'const EXPANSOES_SIGLAS_CLINICAS' not in s:
              expansoes = "\n  const EXPANSOES_SIGLAS_CLINICAS = {HAS:'HAS (Hipertensão Arterial Sistêmica)',DM:'DM (Diabetes Mellitus)',ICC:'ICC (Insuficiência Cardíaca Congestiva)',DPOC:'DPOC (Doença Pulmonar Obstrutiva Crônica)',AVC:'AVC (Acidente Vascular Cerebral)',IAM:'IAM (Infarto Agudo do Miocárdio)',PCR:'PCR (Parada Cardiorrespiratória)',HVE:'HVE (Hipertrofia Ventricular Esquerda)',SCA:'SCA (Síndrome Coronariana Aguda)',TCE:'TCE (Traumatismo Cranioencefálico)'};"
              s = s.replace(old_sig, old_sig + expansoes, 1)
              alvo = "  if (!str) return str;\n  const siglas = ['PA','FC','FR','SPO2','HGT','ECG','AVC','IAM','PCR','DM','HAS','ICC','DPOC','AVCI','TCE','TVP','TEP','SAMU','APH','SCA','EV','IM','SC','SL','VO','SF','SG','BPM','AAS','RCP','UTI','UPA','UBS','SSVV','GCS','SNS','AVCH','AVE','VM','O2','SAT'];"
              if alvo in s:
                  s = s.replace(alvo, "  if (!str) return str;\n  Object.entries(EXPANSOES_SIGLAS_CLINICAS).forEach(([sig, significado]) => {\n    const re = new RegExp('(?<![A-Za-zÀ-ÿ])' + sig + '(?![A-Za-zÀ-ÿ])', 'g');\n    str = str.replace(re, significado);\n  });\n  const siglas = ['PA','FC','FR','SPO2','HGT','ECG','AVC','IAM','PCR','DM','HAS','ICC','DPOC','AVCI','TCE','TVP','TEP','SAMU','APH','SCA','EV','IM','SC','SL','VO','SF','SG','BPM','AAS','RCP','UTI','UPA','UBS','SSVV','GCS','SNS','AVCH','AVE','VM','O2','SAT'];", 1)

          # Ficha de medicamento fora da maleta: adicionar administração.
          if '"administracao": "Como administrar' not in s:
              s = s.replace('''      "via": "Vias disponíveis",\n      "diluente": "Diluente + mL na seringa + tempo",''', '''      "via": "Vias disponíveis",\n      "administracao": "Como administrar: dose, forma de administração e tempo/velocidade quando aplicável",\n      "diluente": "Diluente + mL na seringa + tempo",''')
              s = s.replace('''            <div><div class="row-lbl">💉 Via</div><div class="row-val">${escHtmlAuth(med.via || 'Não informada')}</div></div>\n            <div><div class="row-lbl">🧪 Diluente e preparo</div>''', '''            <div><div class="row-lbl">💉 Via</div><div class="row-val">${escHtmlAuth(med.via || 'Não informada')}</div></div>\n            <div><div class="row-lbl">💊 Administração</div><div class="row-val">${escHtmlAuth(med.administracao || 'Não informada')}</div></div>\n            <div><div class="row-lbl">🧪 Diluente e preparo</div>''')
              s = s.replace('''            <div><div class="row-lbl">💉 Via</div><div class="row-val">${med.via}</div></div>\n            <div><div class="row-lbl">🧪 Diluente e preparo</div>''', '''            <div><div class="row-lbl">💉 Via</div><div class="row-val">${med.via}</div></div>\n            <div><div class="row-lbl">💊 Administração</div><div class="row-val">${med.administracao || 'Não informada'}</div></div>\n            <div><div class="row-lbl">🧪 Diluente e preparo</div>''')

          # Sanitiza os três pontos de renderização da IA.
          s = s.replace('result.innerHTML = html;', 'result.innerHTML = sanitizarHTMLGerado(html);')
          s = s.replace("document.getElementById('buscaResult').innerHTML = html;", "document.getElementById('buscaResult').innerHTML = sanitizarHTMLGerado(html);")
          s = s.replace('res.innerHTML = html;', 'res.innerHTML = sanitizarHTMLGerado(html);')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commitar correções e remover este workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/corrigir-interface.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: corrigir escapes visíveis e completar ficha de medicamentos"
          git push
