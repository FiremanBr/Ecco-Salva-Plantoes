name: Corrigir interface

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Limpar escapes corrompidos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Corrige barras de continuação reais no fim das linhas.
          s = re.sub(r'\\\r?\n', '\n', s)

          # Corrige sequências literais \\n, \\r e \\t inseridas no HTML/JS por commits anteriores,
          # somente quando aparecem como prefixo de uma nova linha.
          s = re.sub(r'(?m)^([ \t]*)\\n', r'\1', s)
          s = re.sub(r'(?m)^([ \t]*)\\r', r'\1', s)
          s = re.sub(r'(?m)^([ \t]*)\\t', r'\1', s)

          # Remove linhas isoladas de barra invertida.
          s = re.sub(r'(?m)^[ \t]*\\[ \t]*\r?\n', '', s)

          # Nunca deixar artefatos literais imediatamente antes do BODY.
          s = re.sub(r'(?:\\n[ \t]*)+(?=</body>)', '', s, flags=re.I)

          p.write_text(s, encoding='utf-8')
          print('Limpeza concluída.')
          PY

      - name: Verificar que os artefatos sumiram
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          s = Path('index.html').read_text(encoding='utf-8')
          body = s.split('</head>', 1)[-1]
          if re.search(r'(?m)^\s*\\n', body):
              print('ERRO: ainda há \\n no início de uma linha do body.')
              sys.exit(1)
          if re.search(r'(?m)^\s*\\[ \t]*$', body):
              print('ERRO: ainda há linha isolada com barra invertida.')
              sys.exit(1)
          print('Verificação concluída.')
          PY

      - name: Commitar correção e remover workflow temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/corrigir-interface.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: remover escapes literais da interface"
          git push
