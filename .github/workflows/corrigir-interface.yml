name: Corrigir interface

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir escapes literais
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove barras de continuação acidentais no fim das linhas.
          s = re.sub(r'\\\r?\n', '\n', s)

          # Remove linhas isoladas contendo apenas uma barra invertida.
          s = re.sub(r'(?m)^[ \t]*\\[ \t]*\r?\n', '', s)

          # Remove o artefato literal \\n antes do fechamento do BODY.
          s = re.sub(r'(?:\\n[ \t]*)+(?=</body>)', '', s, flags=re.I)

          p.write_text(s, encoding='utf-8')
          print('Escapes literais removidos.')
          PY

      - name: Validar ausência de escapes de linha corrompidos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          s = Path('index.html').read_text(encoding='utf-8')
          if re.search(r'(?m)^\\[ \t]*$', s):
              print('ERRO: ainda existem linhas isoladas com barra invertida.')
              sys.exit(1)
          body = s.split('</head>', 1)[-1]
          if re.search(r'(?:\\n[ \t]*)+(?=</body>)', body, flags=re.I):
              print('ERRO: ainda existe artefato literal \\n antes de </body>.')
              sys.exit(1)
          print('Validação dos escapes concluída.')
          PY

      - name: Commitar correção e remover workflow temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/corrigir-interface.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: remover escapes visíveis da interface"
          git push
