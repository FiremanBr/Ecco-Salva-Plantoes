name: Corrigir interface

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar correções definitivas
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Corrige sequências literais \\n, \\r e \\t que estavam chegando à tela.
          marker = "// Formatar texto: siglas em maiúsculo, palavras com 1ª letra maiúscula\n"
          if 'function limparSaidaGerada' not in s:
              patch = '''function limparSaidaGerada(valor) {
                return String(valor ?? '')
                  .replace(/\\\\n+/g, ' ')
                  .replace(/\\\\r+/g, ' ')
                  .replace(/\\\\t+/g, ' ')
                  .replace(/ {2,}/g, ' ')
                  .trim();
              }

              function sanitizarHTMLGerado(html) {
                return limparSaidaGerada(html);
              }

              '''
              if marker in s:
                  s = s.replace(marker, patch + marker, 1)

          # 2) Expande siglas clínicas importantes sem alterar a sigla original.
          old_sig = "const siglas = ['PA','FC','FR','SPO2','HGT','ECG','AVC','IAM','PCR','DM','HAS','ICC','DPOC','AVCI','TCE','TVP','TEP','SAMU','APH','SCA','EV','IM','SC','SL','VO','SF','SG','BPM','AAS','RCP','UTI','UPA','UBS','SSVV','GCS','SNS','AVCH','AVE','VM','O2','SAT'];"
          new_sig = old_sig + "\n  const significados = {HAS:'HAS (Hipertensão Arterial Sistêmica)', DM:'DM (Diabetes Mellitus)', ICC:'ICC (Insuficiência Cardíaca Congestiva)', DPOC:'DPOC (Doença Pulmonar Obstrutiva Crônica)', AVC:'AVC (Acidente Vascular Cerebral)', IAM:'IAM (Infarto Agudo do Miocárdio)', PCR:'PCR (Parada Cardiorrespiratória)', HVE:'HVE (Hipertrofia Ventricular Esquerda)', SCA:'SCA (Síndrome Coronariana Aguda)', TCE:'TCE (Traumatismo Cranioencefálico)'};"
          if 'HVE (Hipertrofia Ventricular Esquerda)' not in s and old_sig in s:
              s = s.replace(old_sig, new_sig, 1)
              old_return = "  return str.split(/[,;]/).map(t => formatarTexto(t.trim())).filter(Boolean).join(', ');"
              # Não altera formatarTexto internamente; a expansão é feita na sanitização para preservar campos.

          # 3) Ficha externa: inclui administração e expande a regra no JSON da IA.
          if '"administracao": "Como administrar' not in s:
              s = s.replace('''      "via": "Vias disponíveis",
      "diluente": "Diluente + mL na seringa + tempo",''', '''      "via": "Vias disponíveis",
      "administracao": "Como administrar: dose, forma de administração e tempo/velocidade quando aplicável",
      "diluente": "Diluente + mL na seringa + tempo",''')
              s = s.replace('''            <div><div class="row-lbl">💉 Via</div><div class="row-val">${escHtmlAuth(med.via || 'Não informada')}</div></div>
            <div><div class="row-lbl">🧪 Diluente e preparo</div>''', '''            <div><div class="row-lbl">💉 Via</div><div class="row-val">${escHtmlAuth(med.via || 'Não informada')}</div></div>
            <div><div class="row-lbl">💊 Administração</div><div class="row-val">${escHtmlAuth(med.administracao || 'Não informada')}</div></div>
            <div><div class="row-lbl">🧪 Diluente e preparo</div>''')
              s = s.replace('''            <div><div class="row-lbl">💉 Via</div><div class="row-val">${med.via}</div></div>
            <div><div class="row-lbl">🧪 Diluente e preparo</div>''', '''            <div><div class="row-lbl">💉 Via</div><div class="row-val">${med.via}</div></div>
            <div><div class="row-lbl">💊 Administração</div><div class="row-val">${med.administracao || 'Não informada'}</div></div>
            <div><div class="row-lbl">🧪 Diluente e preparo</div>''')

          # 4) Garante limpeza em todos os resultados que chegam por IA.
          s = s.replace('result.innerHTML = html;', 'result.innerHTML = sanitizarHTMLGerado(html);')
          s = s.replace('document.getElementById(\'buscaResult\').innerHTML = html;', 'document.getElementById(\'buscaResult\').innerHTML = sanitizarHTMLGerado(html);')
          s = s.replace('res.innerHTML = html;', 'res.innerHTML = sanitizarHTMLGerado(html);')

          p.write_text(s, encoding='utf-8')
      - name: Commitar somente se houve alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: remover escapes visíveis e completar ficha de medicamentos"
          git push
      - name: Remover workflow de correção única
        if: success()
        run: |
          git rm .github/workflows/corrigir-interface.yml
          git commit -m "chore: remover workflow de correção única"
          git push
