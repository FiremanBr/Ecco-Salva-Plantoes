name: Remover texto literal de quebra de linha

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover caracteres literais \n exibidos na tela
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Remove somente ocorrências literais de \\n          # que estejam imediatamente antes do fechamento do BODY.
          s2 = re.sub(r'(?:\\\\n)+\\s*</body>', '</body>', s, flags=re.I)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          PY
      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-literal-newlines.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: remover texto literal de quebra de linha"
          git push origin main
