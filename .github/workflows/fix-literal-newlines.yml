name: Corrigir escapes literais da interface

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Limpar escapes literais do index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove barras de continuação reais no final das linhas.
          s = re.sub(r'\\\r?\n', '\n', s)

          # Remove sequências literais de newline/carriage/tab que foram
          # inseridas como texto entre tags e scripts.
          s = re.sub(r'(?m)^([ \t]*)\\n', r'\1', s)
          s = re.sub(r'(?m)^([ \t]*)\\r', r'\1', s)
          s = re.sub(r'(?m)^([ \t]*)\\t', r'\1', s)

          # Também corrige casos como </script>\n<!-- ... -->.
          s = re.sub(r'\\n(?=\s*(?:<!--|<script|</script>|</body>|</html>))', '', s, flags=re.I)

          # Remove linhas isoladas com barra invertida.
          s = re.sub(r'(?m)^[ \t]*\\[ \t]*\r?\n', '', s)

          p.write_text(s, encoding='utf-8')
          print('Limpeza concluída.')
          PY

      - name: Verificar resultado
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          s = Path('index.html').read_text(encoding='utf-8')
          if re.search(r'(?m)^([ \t]*)\\n', s):
              print('Ainda existe \\n literal no início de linha.')
              sys.exit(1)
          if re.search(r'(?m)^([ \t]*)\\[ \t]*$', s):
              print('Ainda existe linha isolada com barra invertida.')
              sys.exit(1)
          print('OK: nenhum escape corrompido encontrado.')
          PY

      - name: Publicar correção
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "fix: remover escapes literais da interface"
          git push origin main
