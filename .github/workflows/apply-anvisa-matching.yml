name: Apply ANVISA matching
on:
  push:
    paths:
      - '.github/workflows/apply-anvisa-matching.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='SPRINT64: correspondencia exata e aliases clinicos ANVISA'
          if marker not in s:
            print('SPRINT64 ausente; aplicando patch')
            patch=Path('.github/workflows/fix-anvisa-matching.yml').read_text(encoding='utf-8')
            # extract the HTML script payload between patch=r''' and '''
            a=patch.split("patch=r'''",1)[1].split("'''",1)[0]
            s=s.replace('</body>',a+'\n</body>')
            p.write_text(s,encoding='utf-8')
          else: print('SPRINT64 ja presente')
          PY
      - name: Commit patch and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: correspondencia exata de medicamentos ANVISA' || true
          git push
          rm -f .github/workflows/fix-anvisa-matching.yml .github/workflows/force-anvisa-matching.yml .github/workflows/apply-anvisa-matching.yml scripts/.anvisa-matching-trigger
          git add -A
          git commit -m 'chore: remover workflows temporarios de matching' || true
          git push
