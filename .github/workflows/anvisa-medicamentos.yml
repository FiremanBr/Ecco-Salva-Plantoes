name: Sync ANVISA medicines

on:
  push:
    paths:
      - '.github/workflows/anvisa-medicamentos.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e indexar dados oficiais da ANVISA
        shell: bash
        run: |
          set -euo pipefail
          # O servidor dados.anvisa.gov.br apresenta cadeia intermediária TLS incompleta;
          # a origem e o caminho são o domínio oficial da ANVISA e o arquivo oficial documentado.
          curl -k -L --fail --retry 3 -o /tmp/anvisa.csv 'https://dados.anvisa.gov.br/dados/DADOS_ABERTOS_MEDICAMENTOS.csv'
          test "$(wc -c < /tmp/anvisa.csv)" -gt 1000000
          python - <<'PY'
          import csv,json,re
          from pathlib import Path
          raw=Path('/tmp/anvisa.csv').read_bytes(); text=raw.decode('utf-8-sig',errors='replace')
          if '\ufffd' in text[:20000]: text=raw.decode('latin-1',errors='replace')
          try: dialect=csv.Sniffer().sniff(text[:20000],delimiters=';,|\t')
          except Exception: dialect=csv.excel; dialect.delimiter=';'
          reader=csv.DictReader(text.splitlines(),dialect=dialect); headers=reader.fieldnames or []
          def norm(s): return re.sub(r'[^A-Z0-9]','',str(s).upper())
          nh={norm(h):h for h in headers}
          def pick(*names):
            for n in names:
              if norm(n) in nh:return nh[norm(n)]
            for h in headers:
              x=norm(h)
              for n in names:
                y=norm(n)
                if y and (y in x or x in y):return h
            return None
          cols={'produto':pick('NOME_PRODUTO','NOME PRODUTO','NOME_COMERCIAL','NOME COMERCIAL','PRODUTO'),'principio_ativo':pick('PRINCIPIO_ATIVO','PRINCÍPIO ATIVO','PRINCIPIO ATIVO'),'registro':pick('NUMERO_REGISTRO','NÚMERO REGISTRO','REGISTRO'),'empresa':pick('EMPRESA_DETENTORA_REGISTRO','EMPRESA DETENTORA REGISTRO','RAZAO_SOCIAL'),'categoria':pick('CATEGORIA_REGULATORIA','CATEGORIA REGULATORIA'),'classe':pick('CLASSE_TERAPEUTICA','CLASSE TERAPEUTICA'),'apresentacao':pick('APRESENTACAO','APRESENTAÇÃO'),'forma_farmaceutica':pick('FORMA_FARMACEUTICA','FORMA FARMACEUTICA'),'via':pick('VIA_ADMINISTRACAO','VIA ADMINISTRAÇÃO'),'situacao':pick('SITUACAO','SITUAÇÃO')}
          if not cols['produto']: raise SystemExit('Coluna de nome do produto não encontrada: '+repr(headers))
          rows=[]; seen=set()
          for r in reader:
            produto=(r.get(cols['produto']) or '').strip()
            if not produto: continue
            key=(produto.upper(),(r.get(cols['registro']) or '').strip())
            if key in seen: continue
            seen.add(key); item={'nome':produto}
            for k,c in cols.items():
              if k!='produto' and c:
                v=(r.get(c) or '').strip()
                if v:item[k]=v
            rows.append(item)
          Path('anvisa-medicamentos.json').write_text(json.dumps({'fonte':'ANVISA Dados Abertos - Medicamentos Registrados no Brasil','atualizado_em':__import__('datetime').datetime.utcnow().isoformat()+'Z','registros':rows},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('Registros indexados:',len(rows)); print('Colunas:',cols)
          PY
      - name: Substituir busca da Maleta pela base ANVISA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='<script id="sprint61-medicamento-search-clean">'
          if marker not in s: raise SystemExit('Marcador SPRINT61 não encontrado; nenhuma alteração feita.')
          start=s.index(marker); end=s.index('</script>',start)+len('</script>')
          runtime=r'''<script id="sprint62-anvisa-medicamento-search">
          (function(){
            // SPRINT62: fonte única da pesquisa = base oficial de medicamentos da ANVISA.
            // MEDS_DB/Maleta, EXTRAS, aliases locais e IA não participam desta busca.
            const URL_BASE='anvisa-medicamentos.json'; let cache=null;
            function norm(v){return String(v||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
            function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));}
            async function carregar(){if(cache)return cache;const r=await fetch(URL_BASE+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Base ANVISA indisponível');const j=await r.json();cache=j.registros||[];return cache;}
            function score(x,q){const n=norm(x.nome),p=norm(x.principio_ativo);if(n===q)return 100;if(n.startsWith(q))return 80;if(n.includes(q))return 65;if(p===q)return 60;if(p.includes(q))return 45;return 0;}
            function card(x){const a=[];if(x.nome)a.push(['Nome do produto',x.nome]);if(x.principio_ativo)a.push(['Princípio ativo',x.principio_ativo]);if(x.apresentacao)a.push(['Apresentação',x.apresentacao]);if(x.forma_farmaceutica)a.push(['Forma farmacêutica',x.forma_farmaceutica]);if(x.via)a.push(['Via de administração',x.via]);if(x.classe)a.push(['Classe terapêutica',x.classe]);if(x.categoria)a.push(['Categoria regulatória',x.categoria]);if(x.registro)a.push(['Registro ANVISA',x.registro]);if(x.empresa)a.push(['Detentora do registro',x.empresa]);return '<div class="med-card" style="margin-top:12px"><div style="font-size:18px;font-weight:800;margin-bottom:10px">💊 '+esc(x.nome)+'</div><div style="font-size:12px;font-weight:800;color:#55d68b;margin-bottom:8px">FONTE: ANVISA — DADOS ABERTOS</div>'+a.map(v=>'<div style="margin:7px 0"><b>'+esc(v[0])+':</b> '+esc(v[1])+'</div>').join('')+'</div>';}
            async function buscar(q,out){const base=await carregar(),nq=norm(q);const ach=base.map(x=>({x,s:score(x,nq)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,8).map(x=>x.x);out.innerHTML='<button class="btn-voltar" onclick="limparBusca()">← Voltar</button>';if(!ach.length){out.innerHTML+='<div class="error-box">⚠️ Medicamento não encontrado na base oficial de medicamentos registrados da ANVISA.</div>';return;}out.innerHTML+='<div style="font-size:13px;font-weight:800;margin:8px 0 4px">Resultados oficiais da ANVISA</div>'+ach.map(card).join('');}
            window.buscarLivre=async function(){const input=document.getElementById('buscaInput'),out=document.getElementById('buscaResult'),q=input&&input.value?input.value.trim():'';if(!q||!out)return;out.innerHTML='<div class="loading-wrap">🔎 Consultando base oficial da ANVISA...</div>';try{await buscar(q,out);}catch(e){console.error(e);out.innerHTML='<div class="error-box">⚠️ Não foi possível consultar a base oficial da ANVISA agora.</div>';}};
          })();
          </script>'''
          p.write_text(s[:start]+runtime+s[end:],encoding='utf-8')
          PY
      - name: Publicar alteração
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html anvisa-medicamentos.json
          if git diff --cached --quiet; then echo 'Nada para publicar.'; exit 0; fi
          git commit -m 'feat: pesquisa unificada na base oficial de medicamentos da Anvisa'
          git push
