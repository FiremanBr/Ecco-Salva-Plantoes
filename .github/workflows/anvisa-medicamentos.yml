name: Sync ANVISA medicines

on:
  push:
    paths:
      - '.github/workflows/anvisa-medicamentos.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar e indexar dados oficiais da ANVISA
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/anvisa.csv 'https://dados.anvisa.gov.br/dados/DADOS_ABERTOS_MEDICAMENTOS.csv'
          python - <<'PY'
          import csv, json, re
          from pathlib import Path

          src=Path('/tmp/anvisa.csv')
          raw=src.read_bytes()
          text=raw.decode('utf-8-sig',errors='replace')
          if '\ufffd' in text[:20000]:
              text=raw.decode('latin-1',errors='replace')
          sample=text[:20000]
          try:
              dialect=csv.Sniffer().sniff(sample, delimiters=';,|\t')
          except Exception:
              dialect=csv.excel
              dialect.delimiter=';'
          reader=csv.DictReader(text.splitlines(), dialect=dialect)
          headers=reader.fieldnames or []
          def norm(s):
              return re.sub(r'[^A-Z0-9]','',str(s).upper())
          nh={norm(h):h for h in headers}
          def pick(*names):
              for n in names:
                  if norm(n) in nh: return nh[norm(n)]
              for h in headers:
                  x=norm(h)
                  for n in names:
                      y=norm(n)
                      if y and (y in x or x in y): return h
              return None
          cols={
            'produto':pick('NOME_PRODUTO','NOME PRODUTO','NOME_COMERCIAL','NOME COMERCIAL','PRODUTO'),
            'principio_ativo':pick('PRINCIPIO_ATIVO','PRINCÍPIO ATIVO','PRINCIPIO ATIVO'),
            'registro':pick('NUMERO_REGISTRO','NÚMERO REGISTRO','REGISTRO'),
            'empresa':pick('EMPRESA_DETENTORA_REGISTRO','EMPRESA DETENTORA REGISTRO','RAZAO_SOCIAL'),
            'categoria':pick('CATEGORIA_REGULATORIA','CATEGORIA REGULATORIA'),
            'classe':pick('CLASSE_TERAPEUTICA','CLASSE TERAPEUTICA'),
            'apresentacao':pick('APRESENTACAO','APRESENTAÇÃO'),
            'forma_farmaceutica':pick('FORMA_FARMACEUTICA','FORMA FARMACEUTICA'),
            'via':pick('VIA_ADMINISTRACAO','VIA ADMINISTRAÇÃO'),
            'situacao':pick('SITUACAO','SITUAÇÃO'),
          }
          if not cols['produto']:
              raise SystemExit('Coluna de nome do produto não encontrada: '+repr(headers))
          rows=[]; seen=set()
          for r in reader:
              produto=(r.get(cols['produto']) or '').strip()
              if not produto: continue
              key=(produto.upper(),(r.get(cols['registro']) or '').strip())
              if key in seen: continue
              seen.add(key)
              item={'nome':produto}
              for k,c in cols.items():
                  if k=='produto' or not c: continue
                  v=(r.get(c) or '').strip()
                  if v: item[k]=v
              rows.append(item)
          out=Path('anvisa-medicamentos.json')
          out.write_text(json.dumps({'fonte':'ANVISA Dados Abertos - Medicamentos Registrados no Brasil','atualizado_em':__import__('datetime').datetime.utcnow().isoformat()+'Z','registros':rows},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('Registros indexados:',len(rows))
          print('Colunas:',cols)
          PY

      - name: Substituir busca da Maleta pela base ANVISA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script id="sprint61-medicamento-search-clean">'
          if marker not in s:
              raise SystemExit('Marcador SPRINT61 não encontrado; nenhuma alteração feita.')
          start=s.index(marker)
          end=s.index('</script>',start)+len('</script>')
          runtime=r'''<script id="sprint62-anvisa-medicamento-search">
          (function(){
            // SPRINT62: pesquisa de medicamentos usa exclusivamente o índice
            // derivado dos Dados Abertos oficiais da ANVISA. MEDS_DB/Maleta e IA
            // não participam da identificação do medicamento nesta pesquisa.
            const URL_BASE='anvisa-medicamentos.json';
            let cache=null;
            function norm(v){return String(v||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
            function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));}
            async function carregar(){
              if(cache) return cache;
              const r=await fetch(URL_BASE+'?v='+Date.now(),{cache:'no-store'});
              if(!r.ok) throw new Error('Base ANVISA indisponível');
              const j=await r.json(); cache=j.registros||[]; return cache;
            }
            function pontuar(item,q){
              const n=norm(item.nome), p=norm(item.principio_ativo);
              if(n===q) return 100;
              if(n.startsWith(q)) return 80;
              if(n.includes(q)) return 65;
              if(p===q) return 60;
              if(p.includes(q)) return 45;
              return 0;
            }
            function card(item){
              const rows=[];
              if(item.nome) rows.push(['Nome do produto',item.nome]);
              if(item.principio_ativo) rows.push(['Princípio ativo',item.principio_ativo]);
              if(item.apresentacao) rows.push(['Apresentação',item.apresentacao]);
              if(item.forma_farmaceutica) rows.push(['Forma farmacêutica',item.forma_farmaceutica]);
              if(item.via) rows.push(['Via de administração',item.via]);
              if(item.classe) rows.push(['Classe terapêutica',item.classe]);
              if(item.categoria) rows.push(['Categoria regulatória',item.categoria]);
              if(item.registro) rows.push(['Registro ANVISA',item.registro]);
              if(item.empresa) rows.push(['Detentora do registro',item.empresa]);
              return '<div class="med-card" style="margin-top:12px"><div style="font-size:18px;font-weight:800;margin-bottom:10px">💊 '+esc(item.nome)+'</div><div style="font-size:12px;font-weight:800;color:#55d68b;margin-bottom:8px">FONTE: ANVISA — DADOS ABERTOS</div>'+rows.map(x=>'<div style="margin:7px 0"><b>'+esc(x[0])+':</b> '+esc(x[1])+'</div>').join('')+'</div>';
            }
            async function buscarAnvisa(q,out){
              const base=await carregar(), nq=norm(q);
              const achados=base.map(x=>({x,s:pontuar(x,nq)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,8).map(x=>x.x);
              out.innerHTML='<button class="btn-voltar" onclick="limparBusca()">← Voltar</button>';
              if(!achados.length){out.innerHTML+='<div class="error-box">⚠️ Medicamento não encontrado na base oficial de medicamentos registrados da ANVISA.</div>';return;}
              out.innerHTML+='<div style="font-size:13px;font-weight:800;margin:8px 0 4px">Resultados oficiais da ANVISA</div>'+achados.map(card).join('');
            }
            window.buscarLivre=async function(){
              const input=document.getElementById('buscaInput'), out=document.getElementById('buscaResult');
              const q=input&&input.value?input.value.trim():'';
              if(!q||!out)return;
              out.innerHTML='<div class="loading-wrap">🔎 Consultando base oficial da ANVISA...</div>';
              try{await buscarAnvisa(q,out);}catch(e){console.error(e);out.innerHTML='<div class="error-box">⚠️ Não foi possível consultar a base oficial da ANVISA agora.</div>';}
            };
          })();
          </script>'''
          s=s[:start]+runtime+s[end:]
          p.write_text(s,encoding='utf-8')
          print('Busca SPRINT62 instalada.')
          PY

      - name: Publicar alteração
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html anvisa-medicamentos.json
          if git diff --cached --quiet; then echo 'Nada para publicar.'; exit 0; fi
          git commit -m 'feat: pesquisa unificada na base oficial de medicamentos da Anvisa'
          git push
