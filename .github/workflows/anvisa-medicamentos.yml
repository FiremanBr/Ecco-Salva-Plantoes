name: Sync ANVISA medicines

on:
  push:
    paths:
      - '.github/workflows/anvisa-medicamentos.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e indexar dados oficiais da ANVISA
        shell: bash
        run: |
          set -euo pipefail
          curl -k -L --fail --retry 3 -A 'Mozilla/5.0 Ecco-Salva' -o /tmp/anvisa.csv 'https://dados.anvisa.gov.br/dados/DADOS_ABERTOS_MEDICAMENTOS.csv'
          test "$(wc -c < /tmp/anvisa.csv)" -gt 1000000
          python - <<'PY'
          import csv,json,re
          from pathlib import Path
          raw=Path('/tmp/anvisa.csv').read_bytes(); text=raw.decode('utf-8-sig',errors='replace')
          if '\ufffd' in text[:20000]: text=raw.decode('latin-1',errors='replace')
          try: dialect=csv.Sniffer().sniff(text[:20000],delimiters=';,|\t')
          except Exception: dialect=csv.excel; dialect.delimiter=';'
          reader=csv.DictReader(text.splitlines(),dialect=dialect); headers=reader.fieldnames or []
          def norm(s): return re.sub(r'[^A-Z0-9]','',str(s).upper())
          nh={norm(h):h for h in headers}
          def pick(*names):
            for n in names:
              if norm(n) in nh:return nh[norm(n)]
            for h in headers:
              x=norm(h)
              for n in names:
                y=norm(n)
                if y and (y in x or x in y):return h
            return None
          cols={'produto':pick('NOME_PRODUTO','NOME PRODUTO','NOME_COMERCIAL','NOME COMERCIAL','PRODUTO'),'principio_ativo':pick('PRINCIPIO_ATIVO','PRINCÍPIO ATIVO','PRINCIPIO ATIVO'),'registro':pick('NUMERO_REGISTRO','NÚMERO REGISTRO','REGISTRO'),'empresa':pick('EMPRESA_DETENTORA_REGISTRO','EMPRESA DETENTORA REGISTRO','RAZAO_SOCIAL'),'categoria':pick('CATEGORIA_REGULATORIA','CATEGORIA REGULATORIA'),'classe':pick('CLASSE_TERAPEUTICA','CLASSE TERAPEUTICA'),'apresentacao':pick('APRESENTACAO','APRESENTAÇÃO'),'forma_farmaceutica':pick('FORMA_FARMACEUTICA','FORMA FARMACEUTICA'),'via':pick('VIA_ADMINISTRACAO','VIA ADMINISTRAÇÃO'),'situacao':pick('SITUACAO','SITUAÇÃO')}
          if not cols['produto']: raise SystemExit('Coluna de nome do produto não encontrada: '+repr(headers))
          rows=[]; seen=set()
          for r in reader:
            produto=(r.get(cols['produto']) or '').strip()
            if not produto: continue
            key=(produto.upper(),(r.get(cols['registro']) or '').strip())
            if key in seen: continue
            seen.add(key); item={'nome':produto}
            for k,c in cols.items():
              if k!='produto' and c:
                v=(r.get(c) or '').strip()
                if v:item[k]=v
            rows.append(item)
          Path('anvisa-medicamentos.json').write_text(json.dumps({'fonte':'ANVISA Dados Abertos - Medicamentos Registrados no Brasil','atualizado_em':__import__('datetime').datetime.utcnow().isoformat()+'Z','registros':rows},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('Registros indexados:',len(rows)); print('Colunas:',cols)
          PY
      - name: Garantir marcador visual da aba Estudos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- ECCO_ESTUDOS_MARKER_V3 -->'
          if marker not in s:
              patch=r'''<!-- ECCO_ESTUDOS_MARKER_V3 -->
<style>
.ecco-estudos-nav-active{position:relative!important}
.ecco-estudos-nav-active::after{content:""!important;position:absolute!important;left:0!important;right:0!important;bottom:-8px!important;height:3px!important;border-radius:3px!important;background:var(--blue,#3b9be8)!important;display:block!important}
</style>
<script>
(function(){
  function visible(el){var r=el.getBoundingClientRect(),c=getComputedStyle(el);return r.width>0&&r.height>0&&c.display!=='none'&&c.visibility!=='hidden'}
  function estudosAberto(){
    var all=[...document.querySelectorAll('body *')];
    return all.some(function(el){
      if(!visible(el))return false;
      var t=(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
      if(t!=='📚 estudos'&&t!=='estudos'&&!t.endsWith(' estudos'))return false;
      var r=el.getBoundingClientRect();
      return r.width>0&&r.height>0;
    }) && !!document.querySelector('[id*="estud" i], [class*="estud" i]');
  }
  function marcar(){
    var tabs=[...document.querySelectorAll('a,button,[role="button"],.tab,.nav-tab,.nav-item')].filter(function(el){
      if(!visible(el))return false;
      var t=(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
      return t==='📚 estudos'||t==='estudos'||t.endsWith(' estudos');
    });
    var aberto=estudosAberto();
    tabs.forEach(function(el){el.classList.toggle('ecco-estudos-nav-active',aberto)});
  }
  function init(){
    marcar();
    [100,300,700,1200].forEach(function(ms){setTimeout(marcar,ms)});
    new MutationObserver(marcar).observe(document.body,{attributes:true,attributeFilter:['class','style','aria-current'],childList:true,subtree:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
'''
              s=s.replace('</body>',patch+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar base e interface
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anvisa-medicamentos.json index.html
          if git diff --cached --quiet; then echo 'Sem alterações.'; exit 0; fi
          git commit -m 'fix: marcador visual persistente da aba Estudos'
          git push
