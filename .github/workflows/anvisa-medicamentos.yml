name: Sync ANVISA medicines

on:
  push:
    paths:
      - '.github/workflows/anvisa-medicamentos.yml'
      - 'scripts/.study-fix-trigger2'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir Modo Estudo e favoritos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''function handleMaletaMedClick(nome, el, ev) {
  // Clique normal: mantém a seleção/ficha e também garante a estrela de favorito.
  // O toque longo continua sendo usado para remover/adicionar manualmente.
  if (el && el.dataset && el.dataset.skipClick === '1') return;
  if (!_favoritos.has(nome)) toggleFavorito(nome, ev);
  toggleMed(nome, el);
}'''
          new='''function handleMaletaMedClick(nome, el, ev) {
  // Clique curto = selecionar o medicamento. NÃO altera favoritos.
  // Favorito continua exclusivamente no toque/clique prolongado.
  if (el && el.dataset && el.dataset.skipClick === '1') return;
  toggleMed(nome, el);
  if (_modoEstudo) setTimeout(() => abrirPainelModoEstudo(), 0);
}'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'function handleMaletaMedClick(nome, el, ev)' not in s:
              raise SystemExit('Handler de medicamento nao encontrado.')
          marker='<!-- ECCO_FIX_MODO_ESTUDO_V3 -->'
          if marker not in s:
              patch=r'''<!-- ECCO_FIX_MODO_ESTUDO_V3 -->
<style>
#modoEstudoPanel{display:none;margin:10px 0 14px;padding:10px 12px;background:var(--surface2);border:1px solid rgba(59,155,232,.35);border-radius:10px;box-sizing:border-box;width:100%}
#modoEstudoPanel.open{display:block}
#modoEstudoPanel .estudo-title{font-size:11px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
#modoEstudoPanel .estudo-item{margin-bottom:9px}
#modoEstudoPanel .estudo-item:last-child{margin-bottom:0}
</style>
<script>
(function(){
  window.abrirPainelModoEstudo=function(){
    const controls=document.getElementById('maletaControls');
    if(!controls)return;
    let panel=document.getElementById('modoEstudoPanel');
    if(!panel){panel=document.createElement('div');panel.id='modoEstudoPanel';controls.parentNode.insertBefore(panel,controls.nextSibling)}
    if(!_modoEstudo||!selecionados.size){panel.classList.remove('open');panel.innerHTML='';return}
    panel.innerHTML='<div class="estudo-title">📚 Ficha de estudo</div>'+[...selecionados].map(nome=>'<div class="estudo-item">'+buildCardFromDB(nome)+'</div>').join('');
    panel.classList.add('open');
  };
  const originalToggle=window.toggleModoEstudo;
  if(typeof originalToggle==='function'&&!originalToggle.__eccoStudyFix){
    const wrapped=function(){const r=originalToggle.apply(this,arguments);setTimeout(abrirPainelModoEstudo,0);return r};
    wrapped.__eccoStudyFix=true;window.toggleModoEstudo=wrapped;
  }
})();
</script>
'''
              s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          print('Modo Estudo corrigido')
          PY
      - name: Baixar e indexar dados oficiais da ANVISA
        shell: bash
        run: |
          set -euo pipefail
          curl -k -L --fail --retry 3 -A 'Mozilla/5.0 Ecco-Salva' -o /tmp/anvisa.csv 'https://dados.anvisa.gov.br/dados/DADOS_ABERTOS_MEDICAMENTOS.csv'
          test "$(wc -c < /tmp/anvisa.csv)" -gt 1000000
          python - <<'PY'
          import csv,json,re
          from pathlib import Path
          raw=Path('/tmp/anvisa.csv').read_bytes(); text=raw.decode('utf-8-sig',errors='replace')
          if '\ufffd' in text[:20000]: text=raw.decode('latin-1',errors='replace')
          try: dialect=csv.Sniffer().sniff(text[:20000],delimiters=';,|\t')
          except Exception: dialect=csv.excel; dialect.delimiter=';'
          reader=csv.DictReader(text.splitlines(),dialect=dialect); headers=reader.fieldnames or []
          def norm(s): return re.sub(r'[^A-Z0-9]','',str(s).upper())
          nh={norm(h):h for h in headers}
          def pick(*names):
            for n in names:
              if norm(n) in nh:return nh[norm(n)]
            for h in headers:
              x=norm(h)
              for n in names:
                y=norm(n)
                if y and (y in x or x in y):return h
            return None
          cols={'produto':pick('NOME_PRODUTO','NOME PRODUTO','NOME_COMERCIAL','NOME COMERCIAL','PRODUTO'),'principio_ativo':pick('PRINCIPIO_ATIVO','PRINCÍPIO ATIVO','PRINCIPIO ATIVO'),'registro':pick('NUMERO_REGISTRO','NÚMERO REGISTRO','REGISTRO'),'empresa':pick('EMPRESA_DETENTORA_REGISTRO','EMPRESA DETENTORA REGISTRO','RAZAO_SOCIAL'),'categoria':pick('CATEGORIA_REGULATORIA','CATEGORIA REGULATORIA'),'classe':pick('CLASSE_TERAPEUTICA','CLASSE TERAPEUTICA'),'apresentacao':pick('APRESENTACAO','APRESENTAÇÃO'),'forma_farmaceutica':pick('FORMA_FARMACEUTICA','FORMA FARMACEUTICA'),'via':pick('VIA_ADMINISTRACAO','VIA ADMINISTRAÇÃO'),'situacao':pick('SITUACAO','SITUAÇÃO')}
          if not cols['produto']: raise SystemExit('Coluna de nome do produto não encontrada: '+repr(headers))
          rows=[]; seen=set()
          for r in reader:
            produto=(r.get(cols['produto']) or '').strip()
            if not produto: continue
            key=(produto.upper(),(r.get(cols['registro']) or '').strip())
            if key in seen: continue
            seen.add(key); item={'nome':produto}
            for k,c in cols.items():
              if k!='produto' and c:
                v=(r.get(c) or '').strip()
                if v:item[k]=v
            rows.append(item)
          Path('anvisa-medicamentos.json').write_text(json.dumps({'fonte':'ANVISA Dados Abertos - Medicamentos Registrados no Brasil','atualizado_em':__import__('datetime').datetime.utcnow().isoformat()+'Z','registros':rows},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('Registros indexados:',len(rows)); print('Colunas:',cols)
          PY
      - name: Publicar base atualizada
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html anvisa-medicamentos.json
          if git diff --cached --quiet; then echo 'Sem alterações.'; exit 0; fi
          git commit -m 'fix: atualizar Modo Estudo e base ANVISA'
          git push
