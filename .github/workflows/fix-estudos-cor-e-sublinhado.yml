# Correção visual temporária da aba Estudos
name: Fix Estudos color and underline
on:
  push:
    paths:
      - '.github/workflows/fix-estudos-cor-e-sublinhado.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção na aba Estudos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<!-- ECCO_ESTUDOS_MARKER_FINAL -->
          <style>
          #ecosalva-estudos-tab.active, #ecosalva-estudos-tab.ecco-estudos-nav-active { position:relative !important; color:#60a5fa !important; }
          #ecosalva-estudos-tab.active::after, #ecosalva-estudos-tab.ecco-estudos-nav-active::after { content:"" !important; position:absolute !important; left:0 !important; right:0 !important; bottom:-2px !important; height:3px !important; border-radius:3px !important; background:#60a5fa !important; display:block !important; }
          </style>
          <script>
          (function(){
            function mark(){
              var t=document.getElementById('ecosalva-estudos-tab');
              var a=document.getElementById('ecosalva-estudos-area');
              if(t) t.classList.toggle('ecco-estudos-nav-active', !!(a && a.classList.contains('open')));
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mark); else mark();
            new MutationObserver(mark).observe(document.documentElement,{attributes:true,attributeFilter:['class','style'],childList:true,subtree:true});
          })();
          </script>'''
          new = '''<!-- ECCO_ESTUDOS_MARKER_FINAL -->
          <style>
          #ecosalva-estudos-tab.active, #ecosalva-estudos-tab.ecco-estudos-nav-active { position:relative !important; color:#FF4FD8 !important; }
          #ecosalva-estudos-tab.active::after, #ecosalva-estudos-tab.ecco-estudos-nav-active::after { content:none !important; display:none !important; }
          #ecosalva-estudos-tab.ecco-estudos-nav-active { border-bottom:3px solid #FF4FD8 !important; }
          </style>
          <script>
          (function(){
            var previousTab=null, guard=false;
            function mark(){
              if(guard) return;
              var t=document.getElementById('ecosalva-estudos-tab');
              var a=document.getElementById('ecosalva-estudos-area');
              if(!t || !a) return;
              var open=a.classList.contains('open');
              if(open){
                if(!previousTab) previousTab=document.querySelector('.tab.active:not(#ecosalva-estudos-tab)');
                guard=true;
                document.querySelectorAll('.tab.active:not(#ecosalva-estudos-tab)').forEach(function(x){x.classList.remove('active');});
                t.classList.add('active');
                guard=false;
              }else if(previousTab){
                setTimeout(function(){
                  if(document.querySelector('.tab.active:not(#ecosalva-estudos-tab)')) { previousTab=null; return; }
                  if(document.contains(previousTab)) previousTab.classList.add('active');
                  previousTab=null;
                },0);
              }
              t.classList.toggle('ecco-estudos-nav-active',open);
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mark); else mark();
            new MutationObserver(mark).observe(document.documentElement,{attributes:true,attributeFilter:['class','style'],childList:true,subtree:true});
          })();
          </script>'''
          if old in s:
              s=s.replace(old,new,1)
          else:
              marker='<!-- ECCO_ESTUDOS_MARKER_FINAL -->'
              if marker not in s:
                  raise SystemExit('Marcador da aba Estudos não encontrado; nenhuma alteração feita.')
              raise SystemExit('Bloco do marcador encontrado, mas em formato inesperado; nenhuma alteração feita.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar e limpar workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: cor exclusiva e sublinhado unico da aba Estudos' || exit 0
          git push
          git rm .github/workflows/fix-estudos-cor-e-sublinhado.yml || true
          git commit -m 'chore: remover workflow temporario da aba Estudos' || true
          git push || true
