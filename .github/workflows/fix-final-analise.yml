name: Corrigir camera e busca da Analise

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Aplicar correcao definitiva
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- SPRINT56: camera somente na Analise + pesquisa somente na Maleta + parser JSON robusto -->'
          if marker not in s:
              s = marker + '\n' + s

          # Remove estilos antigos que forcam a lupa no campo de medicamentos da Analise.
          s = re.sub(r'<style[^>]*id=["\']sprint5[12]-lupa[^>]*>.*?</style>', '', s, flags=re.I|re.S)
          s = re.sub(r'<style[^>]*id=["\']sprint5[12][^>]*>.*?</style>', '', s, flags=re.I|re.S)

          # Garante a camera original no campo de medicamentos.
          campo = re.search(r'<textarea[^>]+id=["\']anMedsContinuos["\'][^>]*>.*?</textarea>', s, flags=re.I|re.S)
          if campo:
              bloco_start = campo.start()
              bloco_end = s.find('</div>', bloco_start)
              if bloco_end != -1:
                  bloco = s[bloco_start:bloco_end]
                  bloco = re.sub(r'<button[^>]*(?:abrirBuscaForaMaleta|Pesquisar medicamento)[^>]*>.*?</button>', '', bloco, flags=re.I|re.S)
                  if 'abrirCamera()' not in bloco:
                      camera = '<button type="button" onclick="abrirCamera()" title="Fotografar receita ou tela" aria-label="Fotografar receita ou tela" style="background:var(--surface3);border:1px solid var(--border);border-radius:7px;padding:6px 8px;cursor:pointer;font-size:18px;line-height:1">📸</button>'
                      bloco = bloco.replace('</textarea>', '</textarea><div style="position:absolute;bottom:8px;right:8px">'+camera+'</div>')
                  s = s[:bloco_start] + bloco + s[bloco_end:]

          # Injeta um observador: se algum JS antigo recriar uma lupa dentro da Analise,
          # ela e removida imediatamente. A camera permanece.
          runtime = r'''<script id="sprint56-runtime">
          (function(){
            function limparLupaAnalise(){
              var campo=document.getElementById('anMedsContinuos');
              if(!campo||!campo.parentElement)return;
              var area=campo.parentElement;
              area.querySelectorAll('button').forEach(function(b){
                var t=((b.getAttribute('aria-label')||'')+' '+(b.getAttribute('title')||'')+' '+(b.getAttribute('onclick')||'')).toLowerCase();
                if(t.indexOf('pesquisar medicamento')>=0||t.indexOf('abrirbuscaforamaleta')>=0)b.remove();
              });
              if(!area.querySelector('button[onclick*="abrirCamera"]')){
                var d=document.createElement('div');d.style.cssText='position:absolute;bottom:8px;right:8px';
                d.innerHTML='<button type="button" onclick="abrirCamera()" title="Fotografar receita ou tela" aria-label="Fotografar receita ou tela" style="background:var(--surface3);border:1px solid var(--border);border-radius:7px;padding:6px 8px;cursor:pointer;font-size:18px;line-height:1">📸</button>';
                area.appendChild(d);
              }
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',limparLupaAnalise);else limparLupaAnalise();
            new MutationObserver(limparLupaAnalise).observe(document.body,{childList:true,subtree:true});
            setInterval(limparLupaAnalise,1000);
          })();
          </script>'''
          s = s.replace('</body>', runtime+'\n</body>', 1)

          # Parser robusto para respostas que tragam texto extra, markdown ou mais de um bloco JSON.
          start = s.find('async function callClaude(query, tentativa = 1) {')
          end = s.find('\nasync function buscarLivre()', start)
          if start != -1 and end != -1:
              fn = r'''function extrairJSONBuscaRobusto(raw){
            var texto=String(raw||'').trim().replace(/```(?:json|javascript|js)?\s*/gi,'').replace(/```/g,'').trim();
            try{return JSON.parse(texto)}catch(e){}
            for(var inicio=0;inicio<texto.length;inicio++){
              if(texto[inicio]!=='{')continue;
              var profundidade=0, str=false, esc=false;
              for(var i=inicio;i<texto.length;i++){
                var ch=texto[i];
                if(str){if(esc){esc=false;continue}if(ch==='\\') {esc=true;continue}if(ch==='"')str=false;continue}
                if(ch==='"'){str=true;continue}
                if(ch==='{')profundidade++; else if(ch==='}')profundidade--;
                if(profundidade===0){try{return JSON.parse(texto.slice(inicio,i+1))}catch(e){break}}
              }
            }
            throw new Error('JSON nao encontrado na resposta da IA');
          }
          async function callClaude(query,tentativa=1){
            try{
              const data=await callGroqServer([{role:'system',content:SYSTEM_BUSCA},{role:'user',content:'Consulta: '+query}],{model:'qwen/qwen3.6-27b',max_tokens:4000,temperature:0.3});
              const raw=(data?.choices?.[0]?.message?.content||'').trim();
              if(!raw)throw new Error('Resposta invalida');
              return extrairJSONBuscaRobusto(raw);
            }catch(err){
              const msg=String(err?.message||err);
              if(/429|rate|limite|too many/i.test(msg)&&tentativa<=3){await new Promise(r=>setTimeout(r,tentativa*3000));return callClaude(query,tentativa+1)}
              if(/401|403|unauthorized|forbidden/i.test(msg))throw new Error('Sessao nao autorizada para usar a IA. Entre novamente no sistema.');
              throw err;
            }
          }
          '''
              s=s[:start]+fn+s[end:]

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commitar index corrigido
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "SPRINT56: corrigir camera da Analise e busca de medicamentos"
          git push origin main
