name: Limpar SPRINT57

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aguardar correções legadas
        run: sleep 90
      - name: Aplicar patch de nomes comerciais
        run: python3 scripts/add_commercial_names.py
      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/add_commercial_names.py .github/workflows/cleanup-sprint57.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: mostrar nomes comerciais nas fichas [skip ci]"
          git push origin main
