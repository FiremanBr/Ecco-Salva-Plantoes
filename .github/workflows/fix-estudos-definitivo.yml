name: Fix Estudos definitivo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir marcador Estudos sem interferir nas abas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- ECCO_ESTUDOS_MARKER_FINAL -->'
          if marker not in s:
              raise SystemExit('Marcador Estudos não encontrado')
          prefix, suffix = s.split(marker, 1)
          suffix = re.sub(r'\s*<style>.*?</style>\s*<script>.*?</script>\s*$', '', suffix, flags=re.S)
          suffix = re.sub(r'\s*<style>\s*#ecosalva-estudos-tab\.active.*?</style>', '', suffix, count=1, flags=re.S)
          suffix = re.sub(r'\s*<script>\s*\(function\(\)\{\s*var previousTab=null, guard=false;.*?</script>', '', suffix, count=1, flags=re.S)
          css = '''\n<!-- ECCO_ESTUDOS_COR_FINAL -->\n<style>\n#ecosalva-estudos-tab.active, #ecosalva-estudos-tab.ecco-estudos-nav-active { color:#FF4FD8 !important; border-bottom-color:#FF4FD8 !important; }\n#ecosalva-estudos-tab.active::after, #ecosalva-estudos-tab.ecco-estudos-nav-active::after { content:none !important; display:none !important; }\n</style>\n'''
          p.write_text(prefix + marker + css + suffix, encoding='utf-8')
          PY
      - name: Publicar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: Estudos sem bloquear outras abas'
          git push
      - name: Remover workflow temporário
        run: |
          rm -f .github/workflows/fix-estudos-definitivo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-estudos-definitivo.yml
          git commit -m 'chore: remover workflow temporario de Estudos' || exit 0
          git push
