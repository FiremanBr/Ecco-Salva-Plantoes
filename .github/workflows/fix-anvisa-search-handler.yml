name: Fix ANVISA search handler

on:
  push:
    paths:
      - '.github/workflows/fix-anvisa-search-handler.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch search handler
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- SPRINT63: busca da Maleta ligada diretamente à base oficial ANVISA -->'
          if marker not in s:
              script = r'''<!-- SPRINT63: busca da Maleta ligada diretamente à base oficial ANVISA -->
          <script id="sprint63-anvisa-search-handler">
          (function(){
            const URL_BASE='anvisa-medicamentos.json';
            let cache=null;
            const norm=v=>String(v||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
            const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
            function dist(a,b){
              const m=a.length,n=b.length, d=Array.from({length:m+1},(_,i)=>[i]);
              for(let j=1;j<=n;j++) d[0][j]=j;
              for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
              return d[m][n];
            }
            async function base(){
              if(cache)return cache;
              const r=await fetch(URL_BASE+'?v='+Date.now(),{cache:'no-store'});
              if(!r.ok)throw Error('Base ANVISA indisponível');
              const j=await r.json(); cache=Array.isArray(j.registros)?j.registros:[]; return cache;
            }
            function score(x,q){
              const n=norm(x.nome), p=norm(x.principio_ativo), toks=q.split(' ').filter(Boolean);
              if(n===q)return 1200;
              if(n.startsWith(q))return 1000;
              if(n.includes(q))return 850;
              if(p===q)return 800;
              if(p.includes(q))return 700;
              let best=0;
              for(const t of toks){
                if(t.length<4)continue;
                for(const c of [n,p]){
                  for(const w of c.split(' ')){
                    const lim=t.length>=8?2:1, dd=dist(t,w);
                    if(dd<=lim)best=Math.max(best,500-dd*80);
                  }
                }
              }
              return best;
            }
            function card(x){
              const rows=[];
              if(x.nome)rows.push(['Nome do produto',x.nome]);
              if(x.principio_ativo)rows.push(['Princípio ativo',x.principio_ativo]);
              if(x.apresentacao)rows.push(['Apresentação',x.apresentacao]);
              if(x.forma_farmaceutica)rows.push(['Forma farmacêutica',x.forma_farmaceutica]);
              if(x.via)rows.push(['Via de administração',x.via]);
              if(x.classe)rows.push(['Classe terapêutica',x.classe]);
              if(x.categoria)rows.push(['Categoria regulatória',x.categoria]);
              if(x.registro)rows.push(['Registro ANVISA',x.registro]);
              if(x.empresa)rows.push(['Detentora do registro',x.empresa]);
              if(x.situacao)rows.push(['Situação',x.situacao]);
              return '<div class="med-card" style="margin-top:12px"><div class="med-card-header"><div class="med-card-name">💊 '+esc(x.nome||'Medicamento')+'</div><span class="med-badge">🇧🇷 ANVISA</span></div><div class="med-card-body">'+rows.map(r=>'<div><div class="row-lbl">'+esc(r[0])+'</div><div class="row-val">'+esc(r[1])+'</div></div>').join('<div class="divider"></div>')+'</div></div>';
            }
            window.executarBuscaForaMaleta=async function(){
              const input=document.getElementById('buscaForaMaletaInput'),btn=document.getElementById('buscaForaMaletaBtn'),result=document.getElementById('buscaForaMaletaResult');
              if(!input||!btn||!result)return;
              const q=input.value.trim(); if(!q)return;
              btn.disabled=true;
              result.innerHTML='<div class="loading-wrap">🔎 Consultando a base oficial de medicamentos da ANVISA...</div>';
              try{
                const nq=norm(q), data=await base();
                const ativos=data.filter(x=>!x.situacao || norm(x.situacao).includes('ativo'));
                const pool=ativos.length?ativos:data;
                const ach=pool.map(x=>({x,s:score(x,nq)})).filter(o=>o.s>0).sort((a,b)=>b.s-a.s).slice(0,8).map(o=>o.x);
                result.innerHTML='<button class="btn-voltar" onclick="limparBusca()">← Voltar</button>';
                if(!ach.length){
                  result.innerHTML+='<div class="error-box">⚠️ Medicamento não encontrado na base oficial de medicamentos registrados da ANVISA.</div>';
                  return;
                }
                result.innerHTML+='<div style="font-size:13px;font-weight:800;margin:8px 0 4px">Resultados oficiais da ANVISA</div>'+ach.map(card).join('');
              }catch(e){
                console.error(e);
                result.innerHTML='<div class="error-box">⚠️ Não foi possível consultar a base oficial da ANVISA agora.</div>';
              }finally{btn.disabled=false;}
            };
          })();
          </script>
          '''
              s=s.replace('</body>', script+'\n</body>') if '</body>' in s else s+'\n'+script
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: busca externa usa somente ANVISA'
          git rm .github/workflows/fix-anvisa-search-handler.yml
          git commit -m 'chore: remover workflow temporario da busca Anvisa'
          git push
