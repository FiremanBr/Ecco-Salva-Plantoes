name: Fix Estudos safe
on:
  push:
    paths:
      - '**'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcao sem bloquear abas
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for marker in ('<!-- ECCO_ESTUDOS_MARKER_FINAL -->','<!-- ECCO_ESTUDOS_FIX_FINAL -->'):
              start=s.find(marker)
              if start>=0:
                  end=s.find('</script>',start)
                  if end>=0:
                      s=s[:start]+s[end+len('</script>'):]
          fix='''\n<!-- ECCO_ESTUDOS_FINAL_SAFE -->\n<style>\n#ecosalva-estudos-tab.active{color:#FF4FD8!important;border-bottom:3px solid #FF4FD8!important}\n#ecosalva-estudos-tab.active::after{content:none!important;display:none!important}\n</style>\n'''
          if '<!-- ECCO_ESTUDOS_FINAL_SAFE -->' not in s:
              s=s.rstrip()+fix
          p.write_text(s,encoding='utf-8')
          PY
            git add index.html
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "fix: liberar navegacao das abas e aplicar cor de Estudos"
            if git push; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Remover workflow temporario
        if: success()
        run: |
          git fetch origin main
          git reset --hard origin/main
          git rm .github/workflows/fix-estudos-safe.yml || true
          git commit -m "chore: remover workflow temporario de Estudos" || exit 0
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git rm .github/workflows/fix-estudos-safe.yml || true
            git commit -m "chore: remover workflow temporario de Estudos" || exit 0
            if git push; then exit 0; fi
            sleep 2
          done
          exit 1
