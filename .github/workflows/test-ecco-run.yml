name: Apply Estudos tab fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='ECCO_ESTUDOS_TABS_INDEPENDENTES_V4'
          if marker in s:
              print('Patch V4 já presente')
              raise SystemExit(0)
          # Add panel state storage.
          s,n1=re.subn(r'(var previousActiveTab=null;\s*var hiddenStudyNodes=\[\];)', r'\1\n    var hiddenStudyPanels=[];', s, count=1)
          if n1 != 1: raise SystemExit('Não encontrei as variáveis da aba Estudos')
          # Replace the opening logic: hide every native .panel while Studies is open.
          pat=r'''function openStudies\(\)\{.*?hiddenStudyNodes=findStudyNodes\(\);'''
          repl='''function openStudies(){\n      previousActiveTab=document.querySelector('.tab.active:not(#ecosalva-estudos-tab)');\n      hiddenStudyPanels=[];\n      document.querySelectorAll('.panel').forEach(function(p){\n        hiddenStudyPanels.push({el:p,active:p.classList.contains('active'),display:p.style.display||''});\n        p.classList.remove('active');\n        p.style.display='none';\n      });\n      document.querySelectorAll('.tab.active').forEach(function(t){ if(t!==tab) t.classList.remove('active'); });\n      hiddenStudyNodes=findStudyNodes();'''
          s,n2=re.subn(pat,repl,s,count=1,flags=re.S)
          if n2 != 1: raise SystemExit('Não encontrei openStudies')
          # Restore panels on close.
          needle='''      hiddenStudyNodes=[];\n      if(previousActiveTab && document.body.contains(previousActiveTab)){'''
          replacement='''      hiddenStudyNodes=[];\n      hiddenStudyPanels.forEach(function(item){\n        if(!item.el) return;\n        item.el.style.display=item.display;\n        if(item.active) item.el.classList.add('active');\n        else item.el.classList.remove('active');\n      });\n      hiddenStudyPanels=[];\n      if(previousActiveTab && document.body.contains(previousActiveTab)){'''
          if needle not in s: raise SystemExit('Não encontrei closeStudies')
          s=s.replace(needle,replacement,1)
          # Append a marker that cannot be overridden by the old FINAL_SAFE CSS.
          css='''<!-- ECCO_ESTUDOS_TABS_INDEPENDENTES_V4 -->\n<style id="ecco-estudos-marker-v4">\n#ecosalva-estudos-tab.active{position:relative!important;color:#60a5fa!important;background:transparent!important;border-bottom:0!important;}\n#ecosalva-estudos-tab.active::after{content:""!important;position:absolute!important;left:0!important;right:0!important;bottom:-2px!important;height:3px!important;border-radius:3px!important;background:#60a5fa!important;display:block!important;}\n</style>\n'''
          s=s.replace('</body>',css+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -n "ECCO_ESTUDOS_TABS_INDEPENDENTES_V4\|hiddenStudyPanels" index.html | tail -20
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'Nada para publicar'; exit 0; fi
          git commit -m 'fix: isolar aba Estudos das demais'
          git push origin HEAD:main
