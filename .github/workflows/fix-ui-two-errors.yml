name: Fix UI two errors
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Corrigir Estudos sem interferir nas outras abas
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pat=r'function openStudies\(\)\{.*?\n    \}\n    function closeStudies\(\)\{.*?\n    \}'
          repl="function openStudies(){\n      area.classList.add('open');\n      tab.classList.add('active');\n      tab.setAttribute('aria-selected','true');\n    }\n    function closeStudies(){\n      area.classList.remove('open');\n      tab.classList.remove('active');\n      tab.setAttribute('aria-selected','false');\n    }"
          s2=re.sub(pat,repl,s,count=1,flags=re.S)
          if s2==s: raise SystemExit('openStudies/closeStudies não encontrados')
          s=s2
          csspat=r'<!-- ECCO_ESTUDOS_FINAL_SAFE -->\s*<style>.*?</style>'
          css="<!-- ECCO_ESTUDOS_FINAL_SAFE -->\n<style>\n#ecosalva-estudos-tab { color:#FF4FD8 !important; }\n#ecosalva-estudos-tab.active { color:#FF4FD8 !important; border-bottom:3px solid #FF4FD8 !important; background:transparent !important; }\n#ecosalva-estudos-tab.active::after { content:none !important; display:none !important; }\n</style>"
          s2=re.sub(csspat,css,s,count=1,flags=re.S)
          if s2==s: raise SystemExit('CSS Estudos não encontrado')
          p.write_text(s2,encoding='utf-8')
          print('ESTUDOS_CORRIGIDO')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: Estudos sem bloquear outras abas'
          git push || true
